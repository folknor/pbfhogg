[workspace]
members = ["cli"]
exclude = ["bench/osmpbf-baseline"]

[workspace.dependencies]
# Correctly-rounded float parsing keeps config and GeoJSON coordinates
# identical to their CLI-string-parsed equivalents at bbox boundaries.
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }

[workspace.package]
version = "0.5.0"
edition = "2024"
# This declaration is not itself an MSRV check, and none is planned: only a
# nightly toolchain is installed, and no sweep builds on this pinned version.
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["folknor <folk@folk.wtf>"]
repository = "https://github.com/folknor/pbfhogg"

[workspace.lints.clippy]
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "deny"
# Configured in clippy.toml and enabled only where the output choke point is
# the rule: src/commands/mod.rs and cli/src/lib.rs deny it at module level.
disallowed_methods = "allow"

[package]
name = "pbfhogg"
version.workspace = true
authors.workspace = true
description = "Fast OpenStreetMap PBF reader and writer for Rust. Read, write, and merge .osm.pbf files with pipelined parallel decoding."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "LIBRARY.md"
keywords = ["osm", "openstreetmap", "pbf", "protobuf", "gis"]
categories = ["parser-implementations", "encoding", "science::geo"]
# Integration tests are declared below rather than discovered: one binary
# per file made every check sweep link ~50 harnesses and a focused
# `brokkr test` list every one of them to find one test. A file in tests/
# that is neither a module of tests/all.rs nor a [[test]] below is never
# compiled, and nothing reports it.
autotests = false

[features]
default = ["commands"]
geocode-reader = ["dep:s2"]
commands = ["dep:serde_json", "geocode-reader"]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
linux-direct-io = []
linux-io-uring = ["dep:io-uring"]
# Test-only fault injection (`pbfhogg::test_hooks`): a fault plan carried by
# each invocation's cancellation token, plus a few per-object hooks. Nothing
# is process-global, so an armed fault cannot fire in a sibling test and any
# test harness may use them. Product builds never enable it; the hook state
# and checks then compile out entirely.
test-hooks = []

[dependencies]
protohoggr = "0.4.0"
bytes = "1.12.1"
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
memmap2 = "0.9.11"
rayon = "1.12.0"
rustc-hash = "2.1.3"
zstd = "0.14.0"
hotpath = "0.29.2"
quick-xml = "0.42.0"
# XXH3-128 for `digest`; pure Rust, xxh3 only.
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
serde_json = { workspace = true, optional = true }
s2 = { version = "0.2.0", default-features = false, optional = true }
io-uring = { version = "0.7.13", optional = true }
libc = "0.2.189"


[dev-dependencies]
tempfile = "3.27.0"
proptest = "1"

# Every integration test that can share a process, as modules of one binary.
[[test]]
name = "all"
path = "tests/all.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[lints]
workspace = true

# Own process because it lowers its own soft RLIMIT_NOFILE.
[[test]]
name = "process_nofile"
path = "tests/process_nofile.rs"
