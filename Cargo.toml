[workspace]
members = ["crates/lib", "crates/cli", "crates/harness", "crates/guard-portability", "crates/test-scratch", "crates/source-policy", "crates/devkit", "crates/library", "crates/datasets", "crates/verify", "crates/bench"]
# Explicit: edition 2024 implies resolver 3 only for a root package, and a
# virtual manifest has no edition, so without this it would drop to 1.
resolver = "3"
exclude = ["bench/osmpbf-baseline"]

[workspace.dependencies]
# Correctly-rounded float parsing keeps GeoJSON coordinates identical to
# their CLI-string-parsed equivalents. raw_value lets extract --config read a
# bbox edge's own number token, so it is quantized from its digits exactly as
# a -b token is.
serde_json = { version = "1.0.150", features = ["float_roundtrip", "raw_value"] }

[workspace.package]
version = "0.6.0"
edition = "2024"
# Cargo admission floor only, not a verified minimum supported Rust version.
# Checks currently use the installed nightly; Rust 1.99 compatibility has not
# been established for either the library or the installable CLI.
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["folknor <folk@folk.wtf>"]
repository = "https://github.com/folknor/pbfhogg"

# Test-only fault and environment hooks compile under this compiler cfg, never
# under a Cargo feature, so feature unification cannot reach them; the
# hook-testing check sweeps in brokkr.d/checks.toml pass `--cfg`. Declaring it
# here makes a misspelled predicate an unexpected_cfgs diagnostic.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(pbfhogg_test_hooks)"] }

[workspace.lints.clippy]
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
unwrap_used = "deny"
expect_used = "deny"
too_many_lines = "deny"
# Configured in clippy.toml and enabled only where the output choke point is
# the rule: crates/lib/src/commands/mod.rs and crates/cli/src/lib.rs deny it
# at module level.
disallowed_methods = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
