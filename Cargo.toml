[workspace]
members = ["cli"]
exclude = ["bench/osmpbf-baseline"]

[workspace.dependencies]
# Correctly-rounded float parsing keeps config and GeoJSON coordinates
# identical to their CLI-string-parsed equivalents at bbox boundaries.
serde_json = { version = "1.0.150", features = ["float_roundtrip"] }

[workspace.package]
version = "0.5.0"
edition = "2024"
# This declaration is not itself an MSRV check, and none is planned: only a
# nightly toolchain is installed, and no sweep builds on this pinned version.
rust-version = "1.99"
license = "MIT OR Apache-2.0"
authors = ["folknor <folk@folk.wtf>"]
repository = "https://github.com/folknor/pbfhogg"

[workspace.lints.clippy]
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
unwrap_used = "deny"
too_many_lines = "deny"
# Configured in clippy.toml and enabled only where the output choke point is
# the rule: src/commands/mod.rs and cli/src/lib.rs deny it at module level.
disallowed_methods = "allow"

[package]
name = "pbfhogg"
version.workspace = true
authors.workspace = true
description = "Fast OpenStreetMap PBF reader and writer for Rust. Read, write, and merge .osm.pbf files with pipelined parallel decoding."
license.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
readme = "LIBRARY.md"
keywords = ["osm", "openstreetmap", "pbf", "protobuf", "gis"]
categories = ["parser-implementations", "encoding", "science::geo"]
# Integration tests are declared below rather than discovered: one binary
# per file made every check sweep link ~50 harnesses and a focused
# `brokkr test` list every one of them to find one test. A file in tests/
# that is neither a module of tests/all.rs nor a [[test]] below is never
# compiled, and nothing reports it.
autotests = false

[features]
default = ["commands"]
geocode-reader = ["dep:s2"]
commands = ["dep:serde_json", "geocode-reader"]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath", "hotpath/hotpath-alloc"]
linux-direct-io = []
linux-io-uring = ["dep:io-uring"]
# Test-only fault-injection hooks, in two shapes. Product builds enable
# neither; the hook fields, statics and checks then compile out entirely.
#
# `test-hooks`: per-instance hooks, a fault plan carried by one call's
# options or one writer (MergeOptions::panic_at_blob_seq and friends).
# They cannot fire in a sibling test, so any test binary may use them.
#
# `static-test-hooks`: process-global static hooks (the `*test_hooks`
# modules). An armed static fires in every concurrent test of the process
# that reaches its code path, so the capability is kept out of this
# package's shared harnesses by construction rather than by convention:
# tests/all.rs is crate-level cfg'd out whenever this feature is on, and
# the library gates every static on `not(test)` as well, so its unit-test
# harness never has them. In this package only the [[test]] targets below
# that require it can arm one, each in a process of its own. The CLI
# crate's test harnesses link this library too; they assert the
# `STATIC_TEST_HOOKS` constant false at compile time, so any build that
# hands them the statics fails instead. The `faults` check sweep in
# brokkr.toml enables it.
test-hooks = []
static-test-hooks = []

[dependencies]
protohoggr = "0.4.0"
bytes = "1.12.1"
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
memmap2 = "0.9.11"
rayon = "1.12.0"
rustc-hash = "2.1.3"
zstd = "0.14.0"
hotpath = "0.28.7"
quick-xml = "0.42.0"
# XXH3-128 for `digest`; pure Rust, xxh3 only.
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
serde_json = { workspace = true, optional = true }
s2 = { version = "0.2.0", default-features = false, optional = true }
io-uring = { version = "0.7.13", optional = true }
libc = "0.2.189"


[dev-dependencies]
tempfile = "3.27.0"
proptest = "1"

# Every integration test that can share a process, as modules of one binary.
[[test]]
name = "all"
path = "tests/all.rs"

# The fault-injection tests below each arm a process-global static hook in
# the library's `static-test-hooks` code. An armed static fires in any
# concurrent test of the same process that reaches that code path, so each
# keeps a process to itself; one test per target. A shared binary serialized
# by a lock is not equivalent: queueing on a lock ages the check watchdog's
# per-test clock, and only the write pools are known to join every thread
# they start before returning - no audit has checked the other hooked
# pipelines. `required-features` builds them only where the statics exist
# (the `faults` sweep) and keeps them out of every other sweep, where they
# would be empty harnesses. The fault_ prefix is naming only; the feature
# requirement is what puts a target in the faults sweep.

# The worker-panic and hold handshake hooks in write::parallel_writer
# (PANIC_IN_POOL_WORKER and friends), reached by every parallel-writer
# output.
[[test]]
name = "fault_parallel_writer"
path = "tests/fault_parallel_writer.rs"
required-features = ["static-test-hooks"]

# PANIC_AT_POOL_OP_COUNT in write::parallel_gzip, shared with the flush
# variant below, so the two cannot share a binary either.
[[test]]
name = "fault_parallel_gzip"
path = "tests/fault_parallel_gzip.rs"
required-features = ["static-test-hooks"]

[[test]]
name = "fault_parallel_gzip_flush"
path = "tests/fault_parallel_gzip_flush.rs"
required-features = ["static-test-hooks"]

# PANIC_AT_SHARD_IDX in diff::parallel.
[[test]]
name = "fault_diff_parallel"
path = "tests/fault_diff_parallel.rs"
required-features = ["static-test-hooks"]

# PANIC_AT_SHARD_IDX in diff::derive_parallel.
[[test]]
name = "fault_derive_parallel"
path = "tests/fault_derive_parallel.rs"
required-features = ["static-test-hooks"]

# PANIC_AT_BUCKET_IDX in altw external stage 3.
[[test]]
name = "fault_altw_stage3"
path = "tests/fault_altw_stage3.rs"
required-features = ["static-test-hooks"]

# PANIC_AT_STREETS_WAY_IDX in the geocode builder's pass 3; the builder
# itself needs `commands`.
[[test]]
name = "fault_geocode_pass3"
path = "tests/fault_geocode_pass3.rs"
required-features = ["static-test-hooks", "commands"]

# FORCE_LINEAR in read::region_grid, which silently switches every
# concurrent extract to the linear scan; extract needs `commands`.
[[test]]
name = "fault_extract_grid"
path = "tests/fault_extract_grid.rs"
required-features = ["static-test-hooks", "commands"]

# PANIC_AT_DISPATCH_COUNT in write::uring_writer.
[[test]]
name = "fault_uring_writer"
path = "tests/fault_uring_writer.rs"
required-features = ["static-test-hooks", "linux-io-uring"]

# The decode gate and the reorder high-water marks in read::pipeline,
# consulted by every pipelined read in the process.
[[test]]
name = "fault_read_pipeline"
path = "tests/fault_read_pipeline.rs"
required-features = ["static-test-hooks"]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[lints]
workspace = true

# Own process because it lowers its own soft RLIMIT_NOFILE.
[[test]]
name = "process_nofile"
path = "tests/process_nofile.rs"
