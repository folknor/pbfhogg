params.old = { from = "datasets.{dataset}.snapshot", default = "base", help = "the old side's snapshot" }
params.old_variant = { from = "datasets.{dataset}.snapshot.{old}.pbf", default = "raw", help = "the old side's PBF variant" }
params.new = { from = "datasets.{dataset}.snapshot", required = true, help = "the new side's snapshot" }
params.new_variant = { from = "datasets.{dataset}.snapshot.{new}.pbf", default = "raw", help = "the new side's PBF variant" }
params.type = { choices = ["all", "node", "way", "relation"], default = "all", help = "diff's --type, all for none" }

