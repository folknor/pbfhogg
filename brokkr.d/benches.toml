# -- compare

[bench.vs-osmium]
script_file = "../benches/compare/vs-osmium.lua"
description = "One row of the guide's CLI command table, pbfhogg or osmium, inputs cold"
version = 2
date = 2026-11-09
changelog = [
  { version = 2, date = 2026-11-09, note = "Eviction moved from the preflight into the timed block, before every iteration's child, so it holds whatever the hash cache does; the iteration wall includes it" },
  { date = 2026-11-08, note = "Script moved from inline to benches/compare/vs-osmium.lua, unchanged" },
  { version = 1, date = 2026-11-08, note = "Added: cold-cache preflight, osmium given --fsync and --keep-member-nodes" },
]
params.dataset = { from = "datasets", default = "denmark", help = "the dataset" }
