[bench.sort-cold]
script_file = "../benches/sort/sort-cold.lua"
description = "sort of a dataset's file into scratch, input evicted from the page cache, sort's --force optional"
version = 1
date = 2026-11-08
changelog = [
  { date = 2026-11-09, note = "--force checked by its choices before anything is built, its preflight gone; runs unchanged" },
  { version = 1, date = 2026-11-08, note = "Added: reaches unindexed inputs through sort's own --force" },
]
params.dataset = { from = "datasets", default = "denmark", help = "the dataset" }
params.variant = { from = "datasets.{dataset}.pbf", default = "raw", help = "the PBF variant sorted" }
params.force = { choices = ["yes", "no"], default = "no", help = "yes: pass sort's --force, needed for an input without indexdata" }

[bench.sort-pbf]
script_file = "../benches/sort/sort-pbf.lua"
description = "Sort a dataset or snapshot with optional unindexed input, compression and output I/O modes"
version = 1
date = 2026-11-09
changelog = [
  { version = 1, date = 2026-11-09, note = "Ported typed sort: snapshots, force-sort, compression, direct I/O, io_uring and profiling with marker stops" },
]
profile = "release"
features = ["linux-direct-io", "linux-io-uring"]
hotpath_features = ["hotpath"]
alloc_features = ["hotpath-alloc"]
params.dataset = { from = "datasets", default = "denmark", help = "the dataset" }
params.snapshot = { from = "datasets.{dataset}.snapshot", default = "base", help = "base for primary data, or a named snapshot" }
params.variant = { from = "datasets.{dataset}.snapshot.{snapshot}.pbf", default = "indexed", help = "the input PBF variant" }
params.direct-io = { choices = ["yes", "no"], default = "no", help = "yes: use O_DIRECT" }
params.compression = { validated = true, help = "none, zlib[:0-9] or zstd[:signed 32-bit level]; omitted keeps the binary's default" }
params.stop = { validated = true, help = "stop at a marker: FOO_END, FOO or -FOO; also works with profiling" }
params.verbose = { choices = ["yes", "no"], default = "no", help = "yes: print the child's captured output" }
params.force-sort = { choices = ["yes", "no"], default = "no", help = "yes: pass sort's --force for input without indexdata" }
params.io-uring = { choices = ["yes", "no"], default = "no", help = "yes: use io_uring output" }

# -- tags-filter

[bench.tag-select]
script_file = "../benches/tags-filter/tag-select.lua"
description = "Filter PBF objects with optional references, or filter OSC changes, on a dataset or snapshot"
version = 2
date = 2026-11-09
changelog = [
  { version = 2, date = 2026-11-09, note = "Replaced hex expression encoding with readable comma-preserving params using split = false" },
  { version = 1, date = 2026-11-09, note = "Ported typed tags-filter: PBF and OSC inputs, expression encoding, reference modes, inversion, tag removal, jobs, compression, direct I/O and profiling with marker stops" },
]
profile = "release"
features = ["linux-direct-io"]
hotpath_features = ["hotpath"]
alloc_features = ["hotpath-alloc"]
params.dataset = { from = "datasets", default = "denmark", help = "the dataset" }
params.snapshot = { from = "datasets.{dataset}.snapshot", default = "base", help = "base for primary data, or a named snapshot" }
params.input-kind = { choices = ["pbf", "osc"], default = "pbf", help = "input file kind" }
params.input = { from = "datasets.{dataset}.snapshot.{snapshot}.{input-kind}", default = "indexed", help = "PBF variant (typed --variant), or OSC sequence (typed --osc-seq); give an explicit sequence for OSC" }
params.filter = { validated = true, split = false, default = "w/highway=primary", help = "one filter expression, commas included" }
params.omit-referenced = { choices = ["yes", "no"], default = "no", help = "yes: single-pass PBF filter, dropping referenced objects" }
params.invert-match = { choices = ["yes", "no"], default = "no", help = "yes: keep non-matching PBF objects" }
params.remove-tags = { choices = ["yes", "no"], default = "no", help = "yes: strip tags from referenced but unmatched PBF objects" }
params.jobs = { validated = true, help = "worker threads for two-pass PBF or OSC; 0 is auto, omitted uses pbfhogg's default" }
params.direct-io = { choices = ["yes", "no"], default = "no", help = "yes: use O_DIRECT on PBF input" }
params.io-uring = { choices = ["yes", "no"], default = "no", help = "yes is refused: tags-filter has no io_uring writer" }
params.compression = { validated = true, help = "PBF only: none, zlib[:0-9] or zstd[:signed 32-bit level]; omitted keeps the binary's default" }
params.stop = { validated = true, help = "stop at a marker: FOO_END, FOO or -FOO; also works with profiling" }
params.verbose = { choices = ["yes", "no"], default = "no", help = "yes: print the child's captured output" }

# -- time-filter

