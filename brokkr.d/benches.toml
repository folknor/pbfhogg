# Script benches (`brokkr man bench`, `brokkr man bench-config`), run as
# `brokkr bench NAME ...` and stored in brokkr's per-user bench store, which
# `brokkr results` reads. Use these instead of typed pbfhogg bench subcommands.
#
# Layout. This file is the registry: one [bench.NAME] table per bench,
# holding its annotations, build settings and params. The Lua lives in
# benches/FAMILY/NAME.lua at the repository root, never inline, so the
# registry stays a list a reader can scan. FAMILY is the pbfhogg command
# the bench drives (cat, sort, altw, ...), or compare for a bench that
# times pbfhogg against another tool. NAME is the bench's name and the
# file's stem both: unique across every family, without a family prefix,
# lowercase words joined by '-', so `brokkr bench NAME` names one file. Tables here are grouped by family in
# alphabetical order, one comment line naming each family. script_file
# resolves against this file's directory, hence the leading "../". Lua
# shared by several benches goes in the bench_lib directory
# (`brokkr man bench-config bench_lib`), benches/lib, when needed; no bench
# script goes there. bench_lib below resolves against this registry;
# load modules with require("stop"), require("compression"), etc.
# A bench's description is one line saying what it
# measures; what the script does and why belongs in its header comment. version starts at 1
# and goes up, with a changelog entry and a new date, whenever a change
# makes its runs stop comparing with earlier ones.
#
# Param convention: declare integer/bbox domains here, not hand-parsed Lua
# replacements. A source lint cannot reliably distinguish those replacements
# from result-evidence parsing, compression grammar or stricter bbox ordering;
# it would flag legitimate validators. Review declarations and contract tests.
#
# bench_scripts makes `brokkr check` refuse any .lua under benches/ that is
# neither a registered script_file, a bench_lib module nor a contract test.
# bench_tests holds the contract tests (`brokkr man bench contract-tests`),
# run by `brokkr check` and by `brokkr bench --test`: each drives a real
# script against fixtures and asserts the calls it makes and its verdict.

bench_lib = "../benches/lib"
bench_scripts = "../benches"
bench_tests = "../benches/tests"

# -- altw

[bench.embed-locations]
script_file = "../benches/altw/embed-locations.lua"
description = "Embed node coordinates in ways using sparse, external or automatic indexing"
version = 2
date = 2026-11-09
changelog = [
  { version = 2, date = 2026-11-09, note = "Normalize -FOO_END without doubling the suffix; refuse -_END consistently" },
  { version = 1, date = 2026-11-09, note = "Ported typed add-locations-to-ways: index modes, prepass, node retention, forced fallback, snapshots, I/O and profiling with marker stops" },
]
profile = "release"
features = ["linux-direct-io", "linux-io-uring"]
hotpath_features = ["hotpath"]
alloc_features = ["hotpath-alloc"]
params.dataset = { from = "datasets", default = "denmark", help = "the dataset" }
params.snapshot = { from = "datasets.{dataset}.snapshot", default = "base", help = "base for primary data, or a named snapshot" }
params.variant = { from = "datasets.{dataset}.snapshot.{snapshot}.pbf", default = "indexed", help = "the input PBF variant" }
params.direct-io = { choices = ["yes", "no"], default = "no", help = "yes: use O_DIRECT" }
params.compression = { validated = true, help = "none, zlib[:0-9] or zstd[:signed 32-bit level]; omitted keeps the binary's default" }
params.stop = { validated = true, help = "stop at a marker: FOO_END, FOO, -FOO or -FOO_END; also works with profiling" }
params.verbose = { choices = ["yes", "no"], default = "no", help = "yes: print the child's captured output" }
params.index-type = { choices = ["sparse", "external", "auto"], help = "node index type; omitted keeps the built revision's default" }
params.force-altw = { choices = ["yes", "no"], default = "no", help = "yes: forward --force for input without indexdata; pbfhogg judges combinations" }
params.inject-prepass = { choices = ["yes", "no"], default = "no", help = "yes: emit WayMembers-v1 and SharedNodePins-v1 extensions" }
params.keep-untagged-nodes = { choices = ["yes", "no"], default = "no", help = "yes: retain untagged nodes" }
params.ignore-missing-nodes = { choices = ["yes", "no"], default = "no", help = "yes: write missing way vertices as (0, 0); requires a revision supporting this flag" }
params.io-uring = { choices = ["yes", "no"], default = "no", help = "yes: use io_uring output" }

