# Script benches (`brokkr man bench`, `brokkr man bench-config`), run as
# `brokkr bench NAME ...` and stored in brokkr's per-user bench store, which
# `brokkr results` reads. They stand beside the typed `brokkr <command>
# --bench` layer.
#
# Layout. This file is the registry: one [bench.NAME] table per bench,
# holding its annotations, build settings and params. The Lua lives in
# benches/FAMILY/NAME.lua at the repository root, never inline, so the
# registry stays a list a reader can scan. FAMILY is the pbfhogg command
# the bench drives (cat, sort, altw, ...), or compare for a bench that
# times pbfhogg against another tool. NAME is the bench's name and the
# file's stem both: unique across every family, without a family prefix,
# lowercase words joined by '-', so `brokkr bench NAME` names one file. Tables here are grouped by family in
# alphabetical order, one comment line naming each family. script_file
# resolves against this file's directory, hence the leading "../". Lua
# shared by several benches goes in a bench_lib directory
# (`brokkr man bench-config bench_lib`), benches/lib, set here when the
# first shared module lands; no bench script goes there. A bench's
# description is one line saying what it measures; what the script does
# and why belongs in the script's header comment. version starts at 1
# and goes up, with a changelog entry and a new date, whenever a change
# makes its runs stop comparing with earlier ones.

# -- cat

[bench.dedupe-self]
script_file = "../benches/cat/dedupe-self.lua"
description = "cat --dedupe of a dataset's file with itself, input cold or warm as the merge starts"
version = 2
date = 2026-11-09
changelog = [
  { version = 2, date = 2026-11-09, note = "Warm read moved from the preflight into the timed block, so the iteration wall includes it; the cat child's wall is unchanged" },
  { version = 1, date = 2026-11-08, note = "Added: cache state fixed and checked with fincore inside the timed block" },
]
params.dataset = { from = "datasets", default = "denmark", help = "the dataset" }
params.variant = { from = "datasets.{dataset}.pbf", default = "indexed", help = "the PBF variant merged with itself" }
params.cache = { choices = ["cold", "warm"], required = true, help = "the input's page-cache state as the merge starts" }
params.check = { choices = ["yes", "no"], default = "no", help = "yes: diff the output against the input after the merge (a correctness run, not a timing cell)" }

[bench.dedupe-pair]
script_file = "../benches/cat/dedupe-pair.lua"
description = "cat --dedupe of two snapshots of one dataset, inputs cold or warm as the merge starts, reaching passthrough"
version = 2
date = 2026-11-09
changelog = [
  { version = 2, date = 2026-11-09, note = "Warm read moved from the preflight into the timed block, so the iteration wall includes it; the cat child's wall is unchanged" },
  { version = 1, date = 2026-11-09, note = "Added: a second input, so disjoint stretches take passthrough and the coalesced copy" },
]
params.dataset = { from = "datasets", default = "denmark", help = "the dataset" }
params.base = { from = "datasets.{dataset}.snapshot", default = "base", help = "the first input's snapshot" }
params.base_variant = { from = "datasets.{dataset}.snapshot.{base}.pbf", default = "indexed", help = "the first input's PBF variant" }
params.with = { from = "datasets.{dataset}.snapshot", required = true, help = "the second input's snapshot" }
params.with_variant = { from = "datasets.{dataset}.snapshot.{with}.pbf", default = "indexed", help = "the second input's PBF variant" }
params.cache = { choices = ["cold", "warm"], required = true, help = "both inputs' page-cache state as the merge starts" }
params.check = { choices = ["yes", "no"], default = "no", help = "yes: diff the output against the first input after the merge (a correctness run, for a second input that is a subset of the first)" }

