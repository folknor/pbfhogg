# brokkr check + test sweeps. Each [[check]] entry is one (clippy +
# test) pass with its own feature shape. Profiles in [test.profiles]
# reference these by name and layer libtest filters on top.
#
#  - "all"      = test-hooks (fault injection, `pbfhogg::test_hooks`; the
#                 fault tests run here with every other test) +
#                 linux-direct-io + linux-io-uring. Mirrors what --all-features used to
#                 pull in MINUS hotpath (#[hotpath::measure] turns into
#                 runtime measurement that emits a banner to stdout at
#                 process exit, contaminating stdout-output commands
#                 like `pbfhogg diff` under integration tests; hotpath
#                 stays opt-in via `brokkr <cmd> --hotpath`) and MINUS
#                 `commands` because pbfhogg's `default = ["commands"]`
#                 already enables it whenever no_default_features is
#                 false, and pbfhogg-cli always pulls it in via its lib
#                 dep.
#  - "consumer" = no-default-features view; what a downstream library
#                 user builds with `default-features = false, features =
#                 ["commands"]`. Catches lints in always-compiled code
#                 that proc-macros silently mask (e.g. #[hotpath::measure]
#                 swallowing function bodies). Also tests pbfhogg-cli
#                 built without linux-direct-io / linux-io-uring, so the
#                 cli_sort.rs feature_missing tests (gated on
#                 `cfg(not(feature = "linux-..."))`) fire in this sweep
#                 against a CLI that doesn't support the flag; for
#                 pbfhogg-cli this shape is its default build (default =
#                 [], and its `commands` feature is a no-op that exists
#                 purely so brokkr can apply `--features commands` to
#                 both crates).
#
# The sweeps that test the CLI select the CLI and the library harness
# too. Every test that drives the `pbfhogg` binary lives in pbfhogg-cli
# (crates/cli/tests/all.rs), and every test that drives the harness in
# pbfhogg-harness (crates/harness/tests/all.rs), where cargo builds the binary
# with that test build's features and hands its path as
# CARGO_BIN_EXE_<name> - so there is no build_packages pre-build and no
# binary from another sweep to pick up. Every package declares test-hooks,
# linux-direct-io, linux-io-uring and commands under the same names, so
# one feature list serves all three. A sweep that must keep the library
# alone (minimal, geocode-reader) leaves the other two out: their lib dep
# would turn `commands` back on.

[[check]]
name = "all"
packages = ["pbfhogg", "pbfhogg-cli", "pbfhogg-harness", "pbfhogg-test-scratch"]
features = ["test-hooks", "linux-direct-io", "linux-io-uring"]
# `parallel = {}` runs the sweep's test binaries concurrently - prebuilt
# binaries executed directly, budget = tests in flight, defaulting to the L3
# cache domain (the right default for a compute-bound suite). Until 2026-09-02
# every profile here ran libtest's serial default, so this is the first
# parallelism the suite has seen; the per-test 20s watchdog is kept. Two-run
# ritual to judge it: the first run weights by test count (always the slow
# one), and `claims 1-1` on the second means the budget needs raising (see
# brokkr man config parallel). Since the test fold (autotests = false) the
# sweep's binaries are each package's lib unit tests and `all` binary, and
# the process_nofile target; the fan-out therefore parallelizes mostly
# inside the two `all` binaries, and shared scratch between concurrent
# cli_* modules is the class to suspect first if a test flakes.
parallel = {}

# Same build shape as all, without binary fan-out. The serial profile needs
# both sequential binaries and test_threads = 1; either alone is insufficient.
# Keep packages and features aligned with all so clippy can deduplicate them.
# Curated with its own serial:: filter: a complete profile must reference
# every uncurated entry, and the gate deliberately does not run this one.
# The gate runs serial:: tests in the parallel all lane instead; a complete
# lane may not skip them there, so the gate carries no serial guarantee.
[[check]]
name = "all-serial"
packages = ["pbfhogg", "pbfhogg-cli", "pbfhogg-harness", "pbfhogg-test-scratch"]
features = ["test-hooks", "linux-direct-io", "linux-io-uring"]
only = ["serial::"]
curated = true

[[check]]
name = "consumer"
packages = ["pbfhogg", "pbfhogg-cli", "pbfhogg-harness"]
no_default_features = true
features = ["commands"]
parallel = {}

# "minimal" = the configuration the crate advertises but never built.
# `consumer` sets no_default_features and then re-enables `commands`, so
# until this entry existed no sweep ever compiled pbfhogg without it and
# `default-features = false` was an untested claim.
#
# No pbfhogg-cli, deliberately. pbfhogg-cli pins its lib dep as
# `default-features = false, features = ["commands"]`, so the moment the
# CLI joins the build cargo's feature unification turns `commands` back
# on and the sweep silently stops testing what it is named for. This
# sweep must stay scoped to the library package alone.
#
# Integration tests that reach into the feature-gated modules
# (`check`, `export`, `extract`, `inspect::json`, `geocode_index`) carry
# a `#[cfg(feature = "commands")]` on their `mod` line in crates/lib/tests/all.rs so
# they drop out here and still run in full under `all` and `consumer`.
#
# Named explicitly rather than left to the workspace's default selection,
# so a change to the workspace's default members cannot widen it.
[[check]]
name = "minimal"
packages = ["pbfhogg"]
no_default_features = true
features = []
parallel = {}

# Library-only geocode reader configuration, without the builder or CLI.
[[check]]
name = "geocode-reader"
packages = ["pbfhogg"]
no_default_features = true
features = ["geocode-reader"]
parallel = {}

# The glibc-only allocator calls (mallopt, mallinfo2, malloc_trim) are gated
# on target_env = "gnu"; this sweep builds, lints and runs the suite against
# musl so an ungated call fails here rather than in a downstream musl build.
# These executable sweeps require an x86_64 Linux host able to execute musl
# binaries directly. A per-sweep target is a literal triple, not a host
# capability selector. Brokkr refuses configured runners but does not check
# direct executability before building; foreign hosts fail when listing tests.
# Host-capability resolution or an early refusal belongs in brokkr's check
# planner, not a project script or a silent compile-only replacement. Both
# musl sweeps below retain executable coverage until that support exists.
[[check]]
name = "musl"
packages = ["pbfhogg", "pbfhogg-cli", "pbfhogg-harness", "pbfhogg-test-scratch"]
target = "x86_64-unknown-linux-musl"
parallel = {}

# The `all` feature shape on musl. The default-feature `musl` sweep above
# never compiles code behind test-hooks, linux-direct-io or linux-io-uring,
# so a glibc-only call there, or a musl-only behaviour such as the direct
# I/O alignment query returning None off glibc (crates/lib/src/direct_io.rs),
# went unbuilt and unrun. Both musl sweeps are kept: `musl` still covers the
# feature-off branches and the CLI's feature_missing tests on musl. Mixed
# shapes (one platform feature without the other) are covered by neither
# target. The profiling features stay out for the reason given for `all`.
[[check]]
name = "musl-all"
packages = ["pbfhogg", "pbfhogg-cli", "pbfhogg-harness"]
features = ["test-hooks", "linux-direct-io", "linux-io-uring"]
target = "x86_64-unknown-linux-musl"
parallel = {}

# Lint-only, on an architecture the promise guard (crates/cli/tests/guard.rs)
# does not support: its seccomp filter compiles only on little-endian x86_64
# and aarch64. This type-checks the guard's unguarded fallback, and only that,
# through the libc-only fixture crate that mounts it; it says nothing about
# the rest of the workspace on riscv64, whose zstd-sys build would need a C
# toolchain and sysroot for the triple. The triple must stay outside the
# guard's supported set, or the fixture is empty and this checks nothing.
# Nothing is linked or run; it needs only
# `rustup target add riscv64gc-unknown-linux-gnu`.
[[lint_sweep]]
name = "riscv64"
packages = ["pbfhogg-guard-portability"]
target = "riscv64gc-unknown-linux-gnu"

# Doctests live in cargo's `--doc` pseudo-target, which a `parallel` sweep
# cannot carry, and `[test] doctests` is off by default - so until this entry
# existed no doctest in the library ever ran, and a broken example in a doc
# comment was invisible. Workspace-shaped (no `packages`) on purpose: a gate
# needs at least one doctest carrier that spans the whole workspace. Run
# through the gate profile only, to keep tier1 fast.
# pbfhogg-cli's library target is the program, not an API, and sets
# `doctest = false`, and pbfhogg-harness has no library target at all, so
# both are excluded rather than the lane being package-scoped.
[[check]]
name = "doctests"
doc_only = true
test_exclude_packages = ["pbfhogg-cli", "pbfhogg-harness"]

[test]
debug = true
default_package = "pbfhogg"
default_profile = "tier1"
gate_profile = "gate"

# Tier 1 - fast contracts. brokkr check's inner-loop signal during
# refactor. Skips the tier2/tier3/serial submodules; runs everything
# else across every listed sweep, the O_DIRECT and io_uring tests
# included (they exist only in the `all` and `musl-all` sweeps, which build
# both features, and skip on a typed platform refusal). `minimal` contributes
# mostly a compile + clippy gate: the commands-gated test files cfg
# themselves out there.
[test.profiles.tier1]
description = "Fast edit loop used by brokkr check (tier 1)"
sweeps = ["all", "consumer", "minimal", "geocode-reader", "musl", "musl-all"]
skip = ["tier2::", "tier3::", "serial::"]
include_ignored = false

# Tier 3 - focused all-feature correctness profile. include_ignored
# picks up fast ignored tests that #[ignore] keeps out of tier 1.
# Tests slower than brokkr check's fixed 20 s per-test kill are skipped here BY NAME
# and must be run individually via `brokkr test <name> --timeout <secs>`
# (add `-p pbfhogg-cli` when the test is a CLI one, as
# sort_cross_validate_osmium is); without the skip the profile could
# never pass, by construction.
#
# WARNING, and it has bitten once (2026-08-20): these entries are SUBSTRING
# matches, not exact test names. Every fast synthetic test whose name merely
# CONTAINS one of them is silently excluded from this gate too - it still
# passes under tier1, so nothing goes red and nothing announces the loss.
# Two short real-data test names were swallowing four synthetic
# geocode tests that way. Before adding a short name here, grep the suite for
# it; before naming a new test, check it does not contain an entry below.
[test.profiles.full]
description = "Partial all-feature correctness (tier 3); over-watchdog tests run individually via brokkr test"
sweeps = ["all"]
skip = [
    "sort_cross_validate_osmium",
]
include_ignored = true

# Tests requiring sequential binaries and --test-threads=1. Fault tests are
# not a serial case (their hooks are per-run, see pbfhogg::test_hooks).
# Never point this profile at a sweep with parallel: libtest's thread limit
# does not serialize brokkr's binary fan-out. The sweep's own only filter
# selects the serial:: modules. The gate runs these tests in the parallel
# all lane, without this guarantee; see the all-serial entry.
[test.profiles.serial]
description = "Serial tests requiring sequential binaries and --test-threads=1"
sweeps = ["all-serial"]
include_ignored = true
test_threads = 1

# Tier 2 command-slice precedent. crates/cli/tests/cli_sort.rs is already split into
# root (tier 1) + mod backends (also tier 1); once it grows a mod tier2 (many-blob
# boundary fixtures, scratch-leak sweeps), this profile picks them up.
# Add similar entries for other commands as their tier-2 matrices
# land - per testing.md, there is no generic tier2 profile.
#
# The sweeps are named rather than inherited from tier1: cli_sort lives in
# pbfhogg-cli, so the root-only sweeps (minimal, geocode-reader) hold no
# cli_sort test. Verified with `brokkr check --profile sort` and the tier1
# sweep list at a time it held a root-only sweep ahead of these: the run
# stopped there with "cargo test: zero tests ran", and the sweeps after it
# never ran. These are every
# shape the CLI tests run in.
[test.profiles.sort]
description = "Tier 2: expanded sort command tests"
extends = "tier1"
sweeps = ["all", "consumer", "musl", "musl-all"]
tests = ["all"]
only = ["cli_sort::"]
skip = ["serial::"]

# `brokkr check --gate`: every sweep with no filters, plus doctests, plus the
# coverage audit. Under `certifies = "complete"` every (build shape, test)
# pair must run, be `#[ignore]`d at the source, or be justified by a
# `[[quarantine]]` entry - otherwise the check fails as orphaned. That is the
# failure the substring skips in `full` caused silently (see its comment):
# a test that stops running cannot go unnoticed here.
[test.profiles.gate-tests]
description = "Every sweep, unfiltered"
sweeps = ["all", "consumer", "minimal", "geocode-reader", "musl", "musl-all"]

[test.profiles.doc-twin]
description = "The doc-only carrier"
sweeps = ["doctests"]

[test.profiles.gate]
description = "Every sweep unfiltered, doctests, and the coverage audit"
lanes = ["gate-tests", "doc-twin"]
certifies = "complete"
