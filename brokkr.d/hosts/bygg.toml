[bygg.datasets.germany]
origin = "Geofabrik"
download_date = "2026-02-24"
# Berlin. Sized for verify extract on this host: osmium reads the whole file
# whatever the box, so the box only scales its selected-ID sets, and a city
# box keeps complete_ways/smart well inside 30 GiB while still crossing
# dense multipolygons. Also the box multi-extract splits into 5 strips.
bbox = "13.0,52.3,13.8,52.7"
# Germany holds none of the built-in Denmark IDs. getid: the lowest and
# highest ID of each kind in pbf.indexed. getparents: the first and last node
# of the lowest way, and a way member of the lowest relation, so every seed
# has a parent. All present in snapshot 20260420 too (checked 2026-10-28).
getid_ids = ["n100", "n13596564006", "w92", "w1482676703", "r882", "r20258307"]
getparents_ids = ["n442734", "n442740", "w481211268"]

