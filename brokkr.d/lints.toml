# Every textlint rule pins representative files with must_scan, so a dead
# corpus fails an ordinary check. Sentinels pin representative scope;
# they do not prove every glob or exclusion is live. Brokkr owns selector
# validation; its check --audit reports stale selectors and exclusions.
# AGENTS.md's document-folder rule, enforced rather than trusted: nothing
# durable (reference/, docs/, code comments) may cite notes/, and durable
# docs must not point at files that no longer exist. Reads tracked files
# only, so data/ and research/ never count. pre-clippy: text only, no build.
[[script_check]]
name = "doc-links"
command = "python3 -B scripts/check_doc_links.py"
expect = "document conventions ok"
match = "last-line"
stage = "pre-clippy"

# In-memory fixtures for the document checker's supported Markdown subset.
# Each checker's in-memory self-test is a pre-clippy script check like this
# one, run with -B and printing one "... ok" last line; a self-test with no
# script check never runs.
[[script_check]]
name = "doc-links-fixtures"
command = "python3 -B scripts/test_check_doc_links.py"
expect = "document checker fixtures ok"
match = "last-line"
stage = "pre-clippy"

# glibc-only allocator calls live in crates/lib/src/debug.rs and
# crates/lib/src/process.rs, behind
# `cfg(all(target_os = "linux", target_env = "gnu"))` with a no-op fallback.
# A call gated on `target_os = "linux"` alone also compiles for musl, where
# these symbols do not exist. The musl sweeps in checks.toml catch that in
# what they compile: the tested `musl` and `musl-all` shapes, and in the gate
# the lint-only `musl-hotpath-alloc`, `musl-direct-io-only` and
# `musl-io-uring-only` shapes, which reach the profiling code and the mixed
# backend branches. Other feature combinations still never build for musl.
# This rule scans source whatever its features and keeps the calls in the
# reviewed wrappers even when a stray one is correctly gated. It checks
# placement only: the excluded wrapper files are trusted for their own gates,
# and a call spelled other than `libc::name` (an alias, a `use`, a local
# extern) slips past it.
# Matches the `libc::` path, so callers of the wrappers (`crate::debug`'s
# `emit_mallinfo2`; `crate::process`'s `cap_malloc_arenas`, `malloc_trim` and
# `set_mmap_threshold`) stay legal, and `region = "code"` lets comments
# discuss the calls by name.
[[textlint]]
name = "glibc-allocator-calls-live-in-debug"
pattern = '\blibc::(?:mallopt|mallinfo2?|malloc_trim|malloc_stats|malloc_info|M_[A-Z_]+)\b'
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs", "crates/lib/tests/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/src/**/*.rs", "crates/harness/tests/**/*.rs"]
exclude = ["crates/lib/src/debug.rs", "crates/lib/src/process.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs", "crates/cli/src/io_reach.rs", "crates/lib/tests/fault_derive_parallel.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/src/describe.rs", "crates/harness/tests/exe.rs"]
message = "glibc-only allocator calls belong in target_env gnu gated debug/process wrappers"

# Stdout discipline. `print!`/`println!` panic when stdout's reader goes away,
# so `pbfhogg inspect x.pbf | head` used to die with exit 101. The CLI writes
# through crates/cli/src/output.rs, whose writer turns EPIPE into a silent exit 0;
# the library never owns its host's stdout and renders into a caller-supplied
# `io::Write` instead. Rule two matches the bare identifier, not the call, so
# `use std::io::stdout as out;` cannot rename its way past it.
# `region = "code"` keeps doc examples, comments and
# clap help strings out of scope. `eprintln!` stays legal.
# crates/lib/tests/common is mounted by path into pbfhogg (where `commands` is on by
# default) and into pbfhogg-cli (where `commands` is a no-op feature, off in
# the `all`, `musl` and `musl-all` sweeps). A gate on either feature in a shared helper
# would silently drop CLI tests out of those sweeps. Comment lines are exempt
# so the explanation can name the features.
[[textlint]]
name = "no-library-feature-gates-in-tests-common"
pattern = 'feature\s*=\s*"(?:commands|geocode-reader)"'
paths = ["crates/lib/tests/common/**/*.rs"]
except = ['^\s*//']
must_scan = ["crates/lib/tests/common/process.rs"]
message = "crates/lib/tests/common is shared with pbfhogg-cli, where `commands` means something else; gate the mod line in crates/lib/tests/all.rs instead, never a shared helper"

# Fault injection is per-run: every hook's state lives in the fault plan the
# run's token carries (crates/lib/src/test_hooks.rs), so an armed fault cannot reach a
# sibling test in a shared harness. A `static` there, or a `test_hooks`
# module anywhere else, would bring back process-global hooks and the
# one-process-per-test machinery they needed.
[[textlint]]
name = "no-static-fault-hook-state"
pattern = '^\s*(?:pub(?:\([^)]*\))?\s+)?static\s'
paths = ["crates/lib/src/test_hooks.rs"]
region = "code"
must_scan = ["crates/lib/src/test_hooks.rs"]
message = "fault-hook state lives in FaultPlan, carried by the run's Invocation token; a static would fire in every concurrent test of the process"

[[textlint]]
name = "fault-hooks-only-in-test-hooks"
pattern = '\bmod\s+\w*test_hooks\b'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/lib.rs"]
region = "code"
must_scan = ["crates/lib/src/test_hooks.rs"]
message = "fault hooks go in pbfhogg::test_hooks (crates/lib/src/test_hooks.rs) as FaultPlan fields, not in a module of their own"

[[textlint]]
name = "no-print-macro"
pattern = '\b(?:print|println)!\s*[\(\[\{]'
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs", "crates/harness/src/**/*.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs", "crates/cli/src/io_reach.rs", "crates/harness/src/describe.rs"]
message = "print!/println! panic when stdout's reader goes away (pbfhogg ... | head); in the CLI write through output::buffered, in the library into a caller-supplied io::Write"

[[textlint]]
name = "no-stdout-handle"
pattern = '\bstdout\b'
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs", "crates/harness/src/**/*.rs"]
exclude = ["crates/cli/src/output.rs", "crates/harness/src/describe_out.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs", "crates/cli/src/io_reach.rs", "crates/harness/src/describe.rs"]
message = "only crates/cli/src/output.rs (and the harness's describe writer, crates/harness/src/describe_out.rs) acquires stdout; use output::buffered, or have the library take an io::Write"

# Header feature spellings live in `read/block.rs` feature constants. Test
# sources intentionally spell them when building or checking literal fixtures.
# The renumber wire rewriter also uses `DenseNodes` as a protobuf field label.
[[textlint]]
name = "header-features-via-feature-constants"
pattern = '"(?:OsmSchema-V0\.6|DenseNodes|Sort\.Type_then_ID|LocationsOnWays|HistoricalInformation|pbfhogg\.WayMembers-v1|pbfhogg\.SharedNodePins-v1)"'
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs"]
exclude = ["crates/lib/src/read/block.rs"]
except = [
    '2 => "DenseNodes",',
    'repeated_message_field_error\("PrimitiveGroup", "DenseNodes"\)',
    '(?:unpacked_field_error|repeated_field_error)\("DenseNodes",',
]
region = "string"
must_scan = ["crates/lib/src/read/blob.rs", "crates/cli/src/io_reach.rs"]
message = "Use the Feature constants from read/block.rs for PBF header feature names"

# Read-side data the crate has already validated (a constructed block, the
# OSC overlay's arena) is consumed with a panic on a broken invariant, never
# a fallback: an empty tag, a default Info or a dropped element is the silent
# wrong answer validation exists to prevent (`validated` in read/block.rs,
# `arena_invariant_broken` in osc/interner.rs). Input that can genuinely be
# bad is refused with an error. A Result-to-Option `.ok()` in these paths is
# therefore either a swallow or a deliberate "absent" answer, and the second
# carries `// ok-deliberate: <reason>` on the same line; the except regex
# insists on a non-empty reason. Text checks, not proof: the swallow
# spellings `if let Ok`, `.is_err()` then `return None`, `.flatten()` and
# `unwrap_or_default` are common in legitimate optional-field handling and
# are left to review, as is an `.unwrap_or(` whose `""` rustfmt leaves on
# the next line.
[[textlint]]
name = "read-side-ok-is-deliberate"
pattern = '\.ok\(\)'
paths = ["crates/lib/src/read/**/*.rs", "crates/lib/src/blob_meta/**/*.rs", "crates/lib/src/osc/**/*.rs", "crates/lib/src/owned.rs"]
except = ['//\s*ok-deliberate:\s*\S']
region = "code"
test_code = "skip"
must_scan = [
    "crates/lib/src/read/block.rs",
    "crates/lib/src/read/dense.rs",
    "crates/lib/src/read/elements.rs",
    "crates/lib/src/osc/compact.rs",
    "crates/lib/src/osc/interner.rs",
    "crates/lib/src/osc/write.rs",
    "crates/lib/src/owned.rs",
]
message = "A .ok() on validated read-side data swallows a broken invariant; panic through the module's invariant helper, return the error, or mark a deliberate absent answer with // ok-deliberate: <reason>"

# The exact spelling the OSC arena used to turn a bad intern id or bad UTF-8
# into an empty tag key, role, value or user name. Matched on the raw line
# (`region = "code"` would blank the literal), so comment lines are exempt.
[[textlint]]
name = "read-side-no-empty-string-fallback"
pattern = '\.unwrap_or\(""\)'
paths = ["crates/lib/src/read/**/*.rs", "crates/lib/src/blob_meta/**/*.rs", "crates/lib/src/osc/**/*.rs", "crates/lib/src/owned.rs"]
except = ['^\s*//', '//\s*ok-deliberate:\s*\S']
test_code = "skip"
must_scan = ["crates/lib/src/read/block.rs", "crates/lib/src/blob_meta/mod.rs", "crates/lib/src/osc/interner.rs", "crates/lib/src/owned.rs"]
message = "An empty-string fallback on read-side data writes a silent wrong tag, role or user; panic on the broken invariant or return the error"

# The shared test oracles in crates/lib/tests/common read what a successful
# output holds. An empty-string fallback, an error discarded into `None` or
# the infallible `.tags()` iterator (which ends the list early on a bad
# string index) would let a broken output read as a plausible one, so two
# outputs compare equal when one has lost a tag, role or user.
[[textlint]]
name = "test-oracles-no-error-to-empty"
pattern = '\.unwrap_or\(""\)|\bResult::ok\b|\.tags\(\)'
paths = ["crates/lib/tests/common/**/*.rs"]
except = ['^\s*//', '//\s*ok-deliberate:\s*\S']
must_scan = ["crates/lib/tests/common/mod.rs", "crates/lib/tests/common/model.rs"]
message = "A test oracle must refuse an unresolvable value, not read it as empty or end a tag list early; use tags_checked and expect the Result"

[[textlint]]
name = "no-process-mutation"
pattern = '\blibc::(?:mallopt|setrlimit|prlimit|prlimit64)\b'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/process.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs"]
message = "Process mutations belong to the caller's explicit process toolbox"

# docs/cli/commands.md "Names pbfhogg leaves behind" promises that the
# CLI starts no other process and never closes, replaces or changes the flags
# of a descriptor it inherited: a caller hands pbfhogg a descriptor holding a
# lease lock and removes the run's private directories once no process holds
# it. A helper process, or a closed or replaced inherited descriptor, would let
# the caller reclaim a directory something still uses. These are tripwires,
# not proof: an aliased or wrapped import, or a dependency that starts a
# process, escapes them.
[[textlint]]
name = "no-child-process-or-descriptor-reset"
pattern = '\bprocess::(?:Command|Child|Stdio|CommandExt)\b|\buse\s+std::process::\{[^}]*\b(?:Command|CommandExt|Child)\b|\blibc::(?:fork|vfork|exec\w*|posix_spawn\w*|daemon|clone3?|close|close_range|closefrom|dup|dup2|dup3|ioctl)\b|\b(?:F_SETFD|FD_CLOEXEC|FIONBIO)\b|\bfrom_raw_fd\b'
# The library harness inherits brokkr's lease descriptor just as the CLI
# does, so it is held to the same promise.
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs", "crates/harness/src/**/*.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs", "crates/cli/src/io_reach.rs", "crates/harness/src/describe.rs"]
message = "The CLI promises it starts no other process and leaves inherited descriptors alone (docs/cli/commands.md, Names pbfhogg leaves behind); the library harness keeps the same promise"

# The same promise covers file-status flags. The one F_SETFL clears O_NONBLOCK
# on a descriptor crates/lib/src/read/input.rs opened itself.
[[textlint]]
name = "no-file-status-flag-change"
pattern = '\bF_SETFL\b'
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs", "crates/harness/src/**/*.rs"]
exclude = ["crates/lib/src/read/input.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs", "crates/cli/src/io_reach.rs", "crates/harness/src/describe.rs"]
message = "Only crates/lib/src/read/input.rs changes file-status flags, on descriptors it opened; inherited descriptors keep theirs"

# hotpath's hotpath-cpu feature spawns a detached profiler process, which would
# break the no-helper-process promise above. A manifest text match cannot see
# the feature switched on by unification from another dependency, so the check
# reads the resolved graph with every workspace feature on (cargo metadata)
# and also fails on any hotpath version or source other than the audited one.
# pre-test: clippy has brought the lock up to date with the manifests by then.
[[script_check]]
name = "no-hotpath-cpu"
command = "python3 scripts/check_hotpath_cpu.py"
expect = "hotpath-cpu absent"
match = "last-line"
stage = "pre-test"

# statvfs in altw (sparse preallocation, external scratch precheck) guards
# scratch writes and sizes no host resource.
[[textlint]]
name = "no-host-probe"
pattern = 'available_parallelism|/proc/meminfo'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/host.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs"]
message = "Host probes must use Resources at the original program point"

# Direct I/O must keep the alignment the file's device and filesystem
# require, which `crates/lib/src/direct_io.rs` discovers at open (statx) and hands the
# backend with the file. An `O_DIRECT` open anywhere else would skip that and
# assume an alignment. Matching the identifier, not one call spelling,
# also catches a flags variable built elsewhere.
[[textlint]]
name = "o-direct-opens-through-direct-io"
pattern = '\bO_DIRECT\b'
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs"]
exclude = ["crates/lib/src/direct_io.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs", "crates/cli/src/io_reach.rs"]
message = "O_DIRECT files open through crate::direct_io (create_for_write, open_for_read), which also returns the alignment their I/O must keep"

[[textlint]]
name = "no-env-read"
pattern = '\benv::(?:var|var_os|vars|vars_os)\b'
paths = ["crates/lib/src/**/*.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs"]
message = "Environment access belongs to the caller"

# The CLI's command interval markers are reserved for it: brokkr reads exactly
# one CLI_COMMAND_START/CLI_COMMAND_END pair per CLI process as the command's
# span, so no library phase and no other CLI site may spell either name.
# `crates/cli/src/host.rs` defines them and `CommandInterval` is their one emitter.
[[textlint]]
name = "cli-command-interval-names-reserved"
pattern = 'CLI_COMMAND_(?:START|END)'
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs", "crates/harness/src/**/*.rs"]
exclude = ["crates/cli/src/host.rs"]
region = "string"
must_scan = ["crates/lib/src/read/blob.rs", "crates/cli/src/io_reach.rs", "crates/harness/src/describe.rs"]
message = "CLI_COMMAND_START and CLI_COMMAND_END are the CLI's reserved command-interval markers; only host::CommandInterval emits them"

[[textlint]]
name = "no-public-reader-in-commands"
pattern = '\b(?:BlobReader|ElementReader)::(?:open|from_path|from_path_direct|from_path_with_eviction)\b'
paths = ["crates/lib/src/commands/**/*.rs", "crates/lib/src/geocode_index/builder/**/*.rs", "crates/lib/src/scan/**/*.rs", "crates/lib/src/osc/**/*.rs"]
region = "code"
must_scan = ["crates/lib/src/commands/mod.rs", "crates/lib/src/geocode_index/builder/mod.rs", "crates/lib/src/scan/classify.rs", "crates/lib/src/osc/interner.rs"]
message = "Command readers must inherit the caller's host"

# Input page-cache eviction is the caller's policy (ADR-0016), and the
# `host.page-cache-keep.v1` library capability rests on two facts: nothing
# arms input eviction under `PageCachePolicy::Keep`, and every input eviction
# counts into `fadvise_input_evictions`. The types carry the counting
# (`crate::fadvise`: only `evict_input` drops an arbitrary file's pages, and
# it always counts; scratch eviction takes a `scratch::ScratchFile` and counts
# apart, as `fadvise_scratch_evictions`). These
# rules confine the entry points outside their owners: the reader opt-in
# that arms eviction (bare identifiers, so method, path and function-value
# spellings all match) to the read path that applies the host policy, the
# reader's eviction step to the reader, and the counted eviction to that
# step. What the owners do with them is checked in review and by the
# harness's page-cache-keep scenario, not here.
[[textlint]]
name = "input-eviction-armed-only-by-the-reader"
pattern = '\b(?:evict_page_cache|from_path_with_eviction)\b'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/read/blob.rs", "crates/lib/src/read/reader.rs"]
region = "code"
test_code = "skip"
must_scan = ["crates/lib/src/read/pipeline.rs", "crates/lib/src/read/header_walker.rs", "crates/lib/src/commands/mod.rs"]
message = "input page-cache eviction is armed only by BlobReader and ElementReader, from the host's PageCachePolicy or a public caller's opt-in; library code inherits the caller's policy"

[[textlint]]
name = "input-eviction-step-only-in-the-reader"
pattern = '\bevict_consumed_prefix\b'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/read/file_reader.rs", "crates/lib/src/read/blob.rs"]
region = "code"
test_code = "skip"
must_scan = ["crates/lib/src/read/pipeline.rs", "crates/lib/src/read/header_walker.rs"]
message = "FileReader::evict_consumed_prefix runs only from BlobReader's armed eviction step"

[[textlint]]
name = "counted-input-eviction-only-from-the-reader"
pattern = '\bevict_input\b'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/fadvise.rs", "crates/lib/src/read/file_reader.rs"]
region = "code"
test_code = "skip"
must_scan = ["crates/lib/src/read/blob.rs", "crates/lib/src/read/pipeline.rs", "crates/lib/src/read/header_walker.rs"]
message = "fadvise::evict_input is called only by FileReader::evict_consumed_prefix, the reader's eviction under the caller's policy"

# The library's shared rayon tasks run on the caller's `host::Executor`, never
# on whatever pool happens to be ambient. Par-iterators cannot be matched by
# text; each one is wrapped in `executor.install` and checked in review.
# This text rule is the quick early catch; the binding enforcement is
# clippy.toml's disallowed-methods, which resolves definitions: rayon's free
# functions and raw `ThreadPool` methods outside `host.rs`'s executor impls,
# rayon's pool constructors outside `crate::joined_pool::JoinedPool`, and
# `std` thread spawns outside `crate::threads::scope`, `JoinedPool` and the
# session threads that keep and join their handles.
[[textlint]]
name = "no-ambient-rayon"
pattern = '\brayon::(?:spawn|join|scope|in_place_scope|broadcast)\b|build_global'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/host.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs"]
message = "Library rayon tasks must go through the caller's host::Executor, not an ambient pool"

[[textlint]]
name = "no-eprint-macro"
pattern = '\beprint(?:ln)?!'
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs", "crates/harness/src/**/*.rs"]
exclude = ["crates/cli/src/output.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs", "crates/cli/src/io_reach.rs", "crates/harness/src/describe.rs"]
message = "Library diagnostics must use the caller's Diagnostics handle; the CLI writes stderr through output::cli_eprintln! and cli_eprint!, which survive a closed stderr; the library harness writes nothing to stderr at all"

# Test scratch has one owner, the dev-only crates/test-scratch crate
# (`pbfhogg_test_scratch::scratch()`, a `TestScratch` guard): random
# directories under the gitignored data/test-scratch/. Unit tests under
# crates/lib/src/ also reach it as `path_guard::tests::scratch()` and
# integration tests as `common::test_scratch()`; both are re-exports. Fixed
# names in the system temp dir let concurrent check sweeps delete each other's
# fixtures, and a second `TempDir` constructor is a second scratch policy.
# The leaf crate sits outside these explicit source roots. All six rules
# are spelling-bound tripwires: renamed imports and writes by absolute path
# outside the repository stay unseen. must_scan pins representative files
# (including the shared child owner); it is not proof of filesystem ownership.
[[textlint]]
name = "test-scratch-via-test-scratch-crate"
pattern = '\benv::temp_dir\b|\btempfile::(?:tempdir(?:_in)?|tempfile(?:_in)?|spooled_tempfile(?:_in)?|SpooledTempFile|NamedTempFile|Builder|TempDir)\b|\b(?:TempDir|NamedTempFile)::new(?:_in)?\b|\b(?:tempfile_in|tempdir_in)\s*\('
paths = ["crates/lib/src/**/*.rs", "crates/lib/tests/**/*.rs", "crates/cli/src/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/src/**/*.rs", "crates/harness/tests/**/*.rs", "crates/lib/examples/**/*.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs", "crates/lib/tests/fault_derive_parallel.rs", "crates/cli/src/io_reach.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/src/describe.rs", "crates/harness/tests/exe.rs", "crates/lib/examples/gen_test_pbf.rs", "crates/lib/examples/stale_way_blobs.rs", "crates/lib/tests/common/process.rs"]
message = "Test scratch constructors belong only in pbfhogg-test-scratch; use scratch() and its owned helpers"

[[textlint]]
name = "test-children-only-through-owned-runners"
pattern = '\bCommand\s*::\s*new\b'
paths = ["crates/lib/src/**/*.rs", "crates/lib/tests/**/*.rs", "crates/cli/src/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/src/**/*.rs", "crates/harness/tests/**/*.rs", "crates/lib/examples/**/*.rs"]
exclude = ["crates/cli/tests/invoker.rs", "crates/lib/tests/common/oracle.rs", "crates/harness/tests/exe.rs", "crates/cli/tests/guard.rs", "crates/harness/tests/nofile.rs"]
region = "code"
test_code = "only"
must_scan = ["crates/lib/src/read/blob.rs", "crates/lib/tests/fault_derive_parallel.rs", "crates/cli/tests/cli_scratch.rs", "crates/lib/tests/common/process.rs"]
message = "Construct test children only in the CLI invoker, oracle runner, harness runner, guard self-reinvocation or the harness descriptor-limit self-reinvocation"

[[textlint]]
name = "repository-root-only-through-test-scratch"
pattern = '\bCARGO_MANIFEST_DIR\b'
paths = ["crates/lib/src/**/*.rs", "crates/lib/tests/**/*.rs", "crates/cli/src/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/src/**/*.rs", "crates/harness/tests/**/*.rs", "crates/lib/examples/**/*.rs", "crates/source-policy/src/**/*.rs"]
exclude = ["crates/lib/examples/gen_test_pbf.rs"]
region = "string"
must_scan = ["crates/lib/src/read/blob.rs", "crates/lib/tests/fault_derive_parallel.rs", "crates/cli/src/io_reach.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/src/describe.rs", "crates/harness/tests/exe.rs", "crates/lib/examples/stale_way_blobs.rs", "crates/lib/tests/common/process.rs", "crates/source-policy/src/lib.rs"]
message = "Use pbfhogg_test_scratch::repository_root(); only the fixture generator resolves its manifest directory"

[[textlint]]
name = "executable-tests-never-read-checked-in-pbf"
pattern = 'test\.osm\.pbf'
paths = ["crates/lib/src/**/*.rs", "crates/lib/tests/**/*.rs", "crates/cli/src/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/src/**/*.rs", "crates/harness/tests/**/*.rs", "crates/lib/examples/**/*.rs"]
exclude = ["crates/lib/examples/gen_test_pbf.rs"]
region = "string"
must_scan = ["crates/lib/src/read/blob.rs", "crates/lib/tests/fault_derive_parallel.rs", "crates/cli/src/io_reach.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/src/describe.rs", "crates/harness/tests/exe.rs", "crates/lib/examples/stale_way_blobs.rs", "crates/lib/tests/common/process.rs"]
message = "Build executable test inputs in scratch; test.osm.pbf is reserved for doc examples and its generator"

[[textlint]]
name = "no-fixed-test-data-paths"
pattern = '(^|["/])data/'
paths = ["crates/lib/src/**/*.rs", "crates/lib/tests/**/*.rs", "crates/cli/src/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/src/**/*.rs", "crates/harness/tests/**/*.rs", "crates/lib/examples/**/*.rs"]
region = "string"
must_scan = ["crates/lib/src/read/blob.rs", "crates/lib/tests/fault_derive_parallel.rs", "crates/cli/src/io_reach.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/src/describe.rs", "crates/harness/tests/exe.rs", "crates/lib/examples/gen_test_pbf.rs", "crates/lib/examples/stale_way_blobs.rs", "crates/lib/tests/common/process.rs"]
message = "Derive test data paths from owned scratch, never a fixed data/ literal"

# Fixture counters used to generate reusable names instead of fresh cells.
# Match naming spellings, not unrelated atomic synchronization flags.
[[textlint]]
name = "no-static-fixture-name-counters"
pattern = '\bstatic\s+(?:[A-Z0-9_]*(?:COUNTER|FIXTURE|NEXT|SEQ|RUN|_ID)[A-Z0-9_]*)\s*:\s*(?:[A-Za-z_][A-Za-z0-9_]*::)*AtomicU(?:size|8|16|32|64)\b'
paths = ["crates/lib/src/**/*.rs", "crates/lib/tests/**/*.rs", "crates/cli/src/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/src/**/*.rs", "crates/harness/tests/**/*.rs", "crates/lib/examples/**/*.rs"]
region = "code"
test_code = "only"
must_scan = ["crates/lib/src/read/blob.rs", "crates/lib/tests/fault_derive_parallel.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/tests/exe.rs", "crates/lib/tests/common/process.rs"]
message = "Use TestScratch::cell() for fixture names instead of a static name counter"

# Test hosts are owned by the test that made them and drop with it: no
# test holds a host, an entered host or an invocation in a static (inside a
# function or a OnceLock included), so no two tests share a publication log,
# counters, cancellation or lifecycle, and none leaks one with Box::leak.
# Spelling-bound tripwires: a type alias escapes them.
[[textlint]]
name = "no-static-test-hosts"
pattern = '\bstatic\s+\w+\s*:[^=]*\b(?:Host|Entered|Invocation)\b'
paths = ["crates/lib/src/**/*.rs", "crates/lib/tests/**/*.rs", "crates/cli/src/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/src/**/*.rs", "crates/harness/tests/**/*.rs"]
region = "code"
test_code = "only"
must_scan = ["crates/lib/src/read/blob.rs", "crates/lib/tests/fault_derive_parallel.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/tests/exe.rs", "crates/lib/tests/common/process.rs"]
message = "A test owns its Host, Entered and Invocation values; hand them through a per-test fixture, never a static"

[[textlint]]
name = "no-leak-in-tests"
pattern = '\bBox::leak\b'
paths = ["crates/lib/src/**/*.rs", "crates/lib/tests/**/*.rs", "crates/cli/src/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/src/**/*.rs", "crates/harness/tests/**/*.rs"]
except = ['//\s*leak-deliberate:\s*\S']
region = "code"
test_code = "only"
must_scan = ["crates/lib/src/read/blob.rs", "crates/lib/tests/fault_derive_parallel.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/tests/exe.rs", "crates/lib/tests/common/process.rs"]
message = "Test values drop with the test; keep the owner in the test and borrow from it (a deliberate leak carries `// leak-deliberate: why` on its line)"

# Test hosts run their rayon work on a pool of their own
# (`common::test_executor`, `Executor::for_tests`), so no test's width depends
# on the runner or competes for the global pool. Ambient is chosen only where
# it is the subject, marked on its line.
[[textlint]]
name = "no-ambient-executor-in-tests"
pattern = '\bExecutor::Ambient\b'
paths = ["crates/lib/src/**/*.rs", "crates/lib/tests/**/*.rs", "crates/cli/src/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/tests/**/*.rs"]
except = ['//\s*ambient-deliberate:\s*\S']
region = "code"
test_code = "only"
must_scan = ["crates/lib/src/read/blob.rs", "crates/lib/tests/fault_derive_parallel.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/tests/exe.rs", "crates/lib/tests/common/process.rs"]
message = "Tests use the test host's own executor pool; choose Executor::Ambient only where it is the subject, with `// ambient-deliberate: why` on its line"

# The integration binary raises its descriptor limit once, before main
# (crates/lib/tests/process_setup.rs); fixtures and host constructors
# change no process state. The real-limit scenarios own their processes.
[[textlint]]
name = "no-limit-changes-in-test-fixtures"
pattern = '\braise_nofile_to_hard_cap\b|\blibc::setrlimit\b'
paths = ["crates/lib/src/**/*.rs", "crates/lib/tests/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/tests/**/*.rs"]
exclude = ["crates/lib/src/process.rs", "crates/lib/tests/process_setup.rs", "crates/lib/tests/process_nofile.rs", "crates/harness/tests/nofile.rs", "crates/cli/tests/invoker.rs"]
region = "code"
test_code = "only"
must_scan = ["crates/lib/src/read/blob.rs", "crates/lib/tests/common/mod.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/tests/exe.rs"]
message = "Fixtures change no process state; the descriptor limit is raised once at start-up in crates/lib/tests/process_setup.rs, and real-limit scenarios own their processes"

# FIFOs in the integration-test trees have two owners: creation is
# crates/lib/tests/common/mod.rs make_fifo, draining is
# crates/lib/tests/common/fifo_capture.rs, whose reader blocks in poll and is
# woken and joined on finish or drop (the local drains it replaced spun on
# sleep and could leave a reader running). Both rules are spelling-bound
# tripwires: F_SETPIPE_SZ marks a drain because every local drain sized its
# pipe; a drain without it stays unseen. Library and harness unit tests under
# src/ cannot reach the test-tree helpers and stay out of scope.
[[textlint]]
name = "test-fifos-created-only-by-make-fifo"
pattern = '\bmkfifo\s*\('
paths = ["crates/lib/tests/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/tests/**/*.rs"]
exclude = ["crates/lib/tests/common/mod.rs"]
region = "code"
must_scan = ["crates/lib/tests/fault_derive_parallel.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/tests/exe.rs", "crates/lib/tests/common/process.rs"]
message = "Create test FIFOs with crate::common::make_fifo"

[[textlint]]
name = "test-fifo-drains-only-in-fifo-capture"
pattern = '\bF_SETPIPE_SZ\b'
paths = ["crates/lib/tests/**/*.rs", "crates/cli/tests/**/*.rs", "crates/harness/tests/**/*.rs"]
exclude = ["crates/lib/tests/common/fifo_capture.rs"]
region = "code"
must_scan = ["crates/lib/tests/fault_derive_parallel.rs", "crates/cli/tests/cli_scratch.rs", "crates/harness/tests/exe.rs", "crates/lib/tests/host_contract.rs", "crates/lib/tests/seal.rs"]
message = "Drain a test FIFO with crate::fifo_capture::FifoCapture, the one wakeable, joined capture"

# Error propagation (reference/pipeline.md, "Error propagation and
# provenance"). A typed error keeps its kind and
# its cause as it travels; text is only ever produced for the final rendering
# (`Error::report`) and for a caught panic's payload. Every rule below keeps
# `crates/lib/src/error.rs`, which owns the constructors and the io carrier, out of scope.
# The library crate only: the CLI's `Box<dyn Error>` is its program boundary.
[[textlint]]
name = "no-io-error-other"
pattern = '\bio::Error::other\b'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/error.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs"]
message = "io::Error::other flattens a typed error into an opaque Other; use a pbfhogg::Error constructor (Error::internal and friends) or keep the original io::Error"

[[textlint]]
name = "no-io-error-new-other"
pattern = '\bErrorKind::Other\b'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/error.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs"]
message = "io::ErrorKind::Other discards what failed; pick the real io kind, or a pbfhogg::Error constructor"

[[textlint]]
name = "no-io-error-restringing"
pattern = '\bio::Error::new\(\s*\w+\.kind\(\)\s*,\s*(?:\w+\.to_string\(\)|format!)'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/error.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs"]
message = "Rebuilding an io::Error from its own kind and text loses its OS error and its source; add context with Error::context instead"

[[textlint]]
name = "no-map-err-to-string"
pattern = '\.map_err\(\|\w+\|\s*\w+\.to_string\(\)\)'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/error.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs"]
message = "map_err to a String flattens the error's kind and cause; propagate the typed error and add context with Error::context"

[[textlint]]
name = "no-string-error-result"
pattern = '\bResult<(?:[^;{<>,]|<(?:[^<>]|<[^<>]*>)*>)*,\s*String>'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/error.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs"]
message = "A String error carries no kind and no cause; return pbfhogg::Result"

[[textlint]]
name = "no-box-dyn-error"
pattern = 'Box<dyn (?:std::error::)?Error'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/error.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs"]
message = "Box<dyn Error> erases the error's kind; return pbfhogg::Result"

# Only error.rs builds an ErrorKind; everything else uses the constructors
# (`Error::invalid_data`, `Error::internal`, `new_blob_error`, ...), so a new
# classification is one reviewed place.
[[textlint]]
name = "no-error-kind-construction"
pattern = '\bnew_error\(\s*(?:crate::error::)?ErrorKind::'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/error.rs"]
region = "code"
must_scan = ["crates/lib/src/read/blob.rs"]
message = "Build errors with the constructors in error.rs, not new_error(ErrorKind::..)"

# A rough check: an error constructor whose text interpolates another error
# flattens the cause into the message. Pass the cause as the typed source
# (`invalid_data_with`, `internal_with`) or add context to the typed error.
# Catches the single-line shape only. The interpolation sits inside a string
# literal, which `region = "code"` blanks out, so this rule scans the whole
# file (no region).
[[textlint]]
name = "no-error-interpolated-into-message"
pattern = '\b(?:invalid_argument|invalid_data|internal)\(\s*format!\(.*\{(?:e|err|error|source)(?::[^}]*)?\}'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/error.rs"]
must_scan = ["crates/lib/src/read/blob.rs"]
message = "Do not interpolate an error into a new error's message; keep it as the typed source or add context to it"

# Writer counter funnel. `sync_all_ns` / `sync_all_calls` are a pair and
# `recv_wait_ns` is fed by one funnel; `WriterMetrics::sync_recorded` (the
# crate's one output fsync, which records through a private
# `record_sync_all`) and `record_recv_wait` in write/metrics.rs are the only
# places that may move them. A backend that hand-rolled `sync_all_ns.fetch_add` left
# `writer_sync_all_calls` reading zero for two of three backends, which no
# test of the funnel can see. The names are forbidden outright in production
# code (a rustfmt-wrapped `metrics\n.sync_all_ns\n.fetch_add` always lands
# the field name on some line); tests may still read the counters.
# crates/lib/src/output.rs is excused: `PublishSpan` takes read-only snapshots of the
# pair to report the syncs a publication did, and never writes them. The
# scan covers every library file, so a new writer file cannot escape it.
[[textlint]]
name = "writer-paired-counters-only-through-the-funnel"
pattern = '\b(?:sync_all_ns|sync_all_calls|recv_wait_ns)\b'
paths = ["crates/lib/src/**/*.rs"]
exclude = ["crates/lib/src/write/metrics.rs", "crates/lib/src/output.rs"]
region = "code"
test_code = "skip"
must_scan = [
    "crates/lib/src/write/direct_writer.rs",
    "crates/lib/src/write/file_writer.rs",
    "crates/lib/src/write/parallel_writer.rs",
    "crates/lib/src/write/uring_writer.rs",
    "crates/lib/src/write/pipeline.rs",
    "crates/lib/src/write/writer.rs",
]
message = "writer counters sync_all_ns, sync_all_calls and recv_wait_ns are moved only by WriterMetrics::sync_recorded and record_recv_wait in write/metrics.rs, so the paired counters cannot drift apart"

# One ordered-delivery loop. Every pipelined PBF backend runs
# `pipeline::deliver_in_order` and supplies only an `OutputSink`; the loop's
# primitives (popping the reorder buffer, the recv-wait and high-water
# records, the completeness check) appear nowhere else under crates/lib/src/write/, so a
# backend cannot grow a private copy of the loop whose counters drift from
# the others (decisions/0014-output-backends-stay-separate.md, amendment).
# metrics.rs defines the records. parallel_gzip.rs is excluded because the
# OSC gzip writer reorders with `ReorderBuffer` (so it calls `pop_ready`) but
# is not a PBF backend: it carries flush barriers and failed-chunk
# placeholders instead of `OutputChunk`s, must keep draining after a failure
# so every barrier is answered (the shared loop returns on its first error),
# and keeps its own `parallel_gzip_*` counters. The next rule keeps the PBF
# loop's records and completeness check out of it.
[[textlint]]
name = "writer-loop-primitives-only-in-the-shared-loop"
pattern = '\b(?:pop_ready|check_stream_complete|record_recv_wait|record_reorder_high_water)\b'
paths = ["crates/lib/src/write/**/*.rs"]
exclude = ["crates/lib/src/write/pipeline.rs", "crates/lib/src/write/metrics.rs", "crates/lib/src/write/parallel_gzip.rs"]
region = "code"
must_scan = [
    "crates/lib/src/write/parallel_writer.rs",
    "crates/lib/src/write/uring_writer.rs",
    "crates/lib/src/write/writer.rs",
]
message = "the receive, reorder and completeness loop is pipeline::deliver_in_order; a backend implements OutputSink instead of looping itself"

[[textlint]]
name = "gzip-writer-uses-no-pbf-loop-records"
pattern = '\b(?:check_stream_complete|record_recv_wait|record_reorder_high_water|SeqTotal)\b'
paths = ["crates/lib/src/write/parallel_gzip.rs"]
region = "code"
must_scan = ["crates/lib/src/write/parallel_gzip.rs"]
message = "the OSC gzip writer keeps its own parallel_gzip_* counters and proves completeness in finish against its own sent count; the PBF loop's records would change what the PBF writer counters mean"

# Writer counter emission. The writer set is an invocation total, so emitting
# it from a per-writer path (`PbfWriter::flush` once did) publishes N sidecar
# samples of one total that a reader takes for N per-writer numbers, and the
# `emit_once` latch then turns the real end-of-invocation call into a no-op.
# Only the end-of-invocation hook (`pbfhogg::write::emit_writer_counters`,
# called once from the CLI's exit path) may emit. `emit` is private to
# write/metrics.rs, so `emit_once(invocation)` is the one spelling to
# cover, inline (`metrics.writer.emit_once(..)`) or rustfmt-wrapped (a line
# beginning with `.emit_once(`); the pattern matches both. host.rs is
# excluded for `Diagnostics::emit_once`, a different method. Owners are
# write/metrics.rs (defines emit and emit_once), write/mod.rs (the hook) and
# crates/cli/src/lib.rs (the exit path that calls it).
[[textlint]]
name = "writer-counters-emitted-only-from-the-exit-hook"
pattern = '\.\s*emit_once\s*\('
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs"]
exclude = ["crates/lib/src/write/metrics.rs", "crates/lib/src/write/mod.rs", "crates/lib/src/host.rs"]
region = "code"
test_code = "skip"
must_scan = [
    "crates/lib/src/write/direct_writer.rs",
    "crates/lib/src/write/file_writer.rs",
    "crates/lib/src/write/parallel_writer.rs",
    "crates/lib/src/write/uring_writer.rs",
    "crates/lib/src/write/pipeline.rs",
    "crates/lib/src/write/writer.rs",
]
message = "writer counters are an invocation total; emit them only from the end-of-invocation hook pbfhogg::write::emit_writer_counters, never from a per-writer path"

# The hook spelling: a backend calling `emit_writer_counters()` (qualified or
# imported) re-creates per-writer emission by the other route. Only the
# CLI's exit path and the library harness's runner (once per call, after it
# returns) call it; write/mod.rs defines it.
[[textlint]]
name = "writer-counter-hook-called-only-from-the-cli-exit-path"
pattern = '\bemit_writer_counters\s*\('
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs", "crates/harness/src/**/*.rs"]
exclude = ["crates/lib/src/write/mod.rs", "crates/cli/src/lib.rs", "crates/harness/src/runner.rs"]
region = "code"
test_code = "skip"
must_scan = [
    "crates/lib/src/write/direct_writer.rs",
    "crates/lib/src/write/file_writer.rs",
    "crates/lib/src/write/parallel_writer.rs",
    "crates/lib/src/write/uring_writer.rs",
    "crates/lib/src/write/pipeline.rs",
    "crates/lib/src/write/writer.rs",
]
message = "emit_writer_counters is the once-per-invocation exit hook; only the CLI exit path and the harness runner call it"

# Read-side twin of the writer exit-hook rules. The pool-drop counters are
# invocation totals, so only the one end-of-invocation hook may emit them; a
# per-pipeline emission would publish N samples of a total, and the latch
# would turn the exit call into a no-op after the first. The per-pool emitter
# is called only by the hook (read/mod.rs); the hook only by the CLI exit path
# and the library harness's runner.
[[textlint]]
name = "read-pool-counters-emitted-only-from-the-exit-hook"
pattern = '\bemit_decompress_pool_counters\s*\('
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs"]
exclude = ["crates/lib/src/read/mod.rs", "crates/lib/src/read/pipeline_metrics.rs"]
region = "code"
test_code = "skip"
must_scan = [
    "crates/lib/src/read/pipeline.rs",
    "crates/lib/src/read/reader.rs",
    "crates/lib/src/read/blob.rs",
    "crates/lib/src/read/decompress.rs",
    "crates/lib/src/scan/classify.rs",
]
message = "pool-drop counters are an invocation total; only pbfhogg::read::emit_read_counters (read/mod.rs) emits them"

[[textlint]]
name = "read-counter-hook-called-only-from-the-cli-exit-path"
pattern = '\bemit_read_counters\s*\('
paths = ["crates/lib/src/**/*.rs", "crates/cli/src/**/*.rs", "crates/harness/src/**/*.rs"]
exclude = ["crates/lib/src/read/mod.rs", "crates/cli/src/lib.rs", "crates/harness/src/runner.rs"]
region = "code"
test_code = "skip"
must_scan = [
    "crates/lib/src/read/pipeline.rs",
    "crates/lib/src/read/reader.rs",
    "crates/lib/src/read/blob.rs",
    "crates/lib/src/read/decompress.rs",
    "crates/lib/src/scan/classify.rs",
]
message = "emit_read_counters is the once-per-invocation exit hook; only the CLI exit path and the harness runner call it"

# The Rust-source audits that no one-line forbid rule can express (sealed
# lifecycle shapes, counter casts, the library static inventory, test-module
# reachability, I/O transfer sizes, the CLI tests' library surface, entropy
# ownership and the library text rule) are the unit tests of
# crates/source-policy, run once per check in the all sweep over one
# tokenized corpus, not script checks.

# scripts/vs-osmium.sh against a recording brokkr stub; brokkr's bench
# contract tests are Lua, so the shell driver's test lives here.
[[script_check]]
name = "vs-osmium-driver-fixtures"
command = "python3 -B scripts/test_vs_osmium_driver.py"
expect = "vs-osmium driver fixtures ok"
match = "last-line"
stage = "pre-clippy"

# Counter tests assert fixed totals or synchronize on observed slow paths.
# The identifier tripwire also catches importing sleep under an alias; it
# intentionally covers the complete two modules, which have no sleep use.
[[textlint]]
name = "counter-modules-do-not-sleep"
pattern = '\bsleep\b'
paths = ["crates/lib/src/counters.rs", "crates/lib/src/write/metrics.rs"]
region = "code"
must_scan = ["crates/lib/src/counters.rs", "crates/lib/src/write/metrics.rs"]
message = "Counter tests use exact inputs and slow-path handshakes instead of sleeps"

# Dataset-sized scenario assertions stream through file_assertions.rs.
# This is a spelling-bound tripwire, including imports of read_to_end and
# fs::read under aliases; renamed fs modules and custom wrappers need review.
# Small protocol and executable-test captures outside scenarios stay legal.
[[textlint]]
name = "scale-scenarios-do-not-read-whole-files"
pattern = '\bfs\s*::\s*(?:read|read_to_string)\b|\b(?:read_to_end|read_to_string)\b'
paths = ["crates/harness/src/scenarios/**/*.rs"]
region = "code"
must_scan = ["crates/harness/src/scenarios/file_assertions.rs", "crates/harness/src/scenarios/nofile.rs"]
message = "Use bounded file_assertions helpers for dataset-sized scenario observations"

# Test-run hygiene, owned by pbfhogg because the runner clears and checks
# nothing: the pre-test entry empties data/test-scratch and records a
# stat manifest of the checkout; the post-test entry fails if the checkout
# changed or test scratch is not empty after a green test phase. Keep these
# the last entries of their stages, so no other pre-test check writes after
# the snapshot. scripts/test_tree.py states what the manifest excludes and
# cannot see.
[[script_check]]
name = "test-tree-clear-and-snapshot"
command = "python3 -B scripts/test_tree.py clear-and-snapshot"
expect = "test tree snapshot ok"
match = "contains"
stage = "pre-test"

[[script_check]]
name = "test-tree-verify"
command = "python3 -B scripts/test_tree.py verify"
expect = "test tree unchanged"
match = "last-line"
stage = "post-test"
