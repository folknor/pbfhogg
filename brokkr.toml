project = "pbfhogg"

# The rest of the config lives in brokkr.d/: check sweeps and test
# profiles, text lints and script checks, and one file per host holding
# its paths, drives and datasets. Per-machine sections are keyed by
# hostname; an unknown hostname falls back to data="data",
# scratch="data/scratch", and each host lists only the datasets it has.
include = [
    "brokkr.d/checks.toml",
    "brokkr.d/lints.toml",
    "brokkr.d/benches.toml",
    "brokkr.d/hosts/plantasjen.toml",
    "brokkr.d/hosts/dm6.toml",
    "brokkr.d/hosts/bygg.toml",
]

# Env variables that match these are captured by brokkr during runs and stored in the database.
capture_env = ["PBFHOGG*", "MALLOC*"]

# Compile each workspace member's lib and bins under its own package-mode
# resolve - the boundary `cargo install pbfhogg-cli` and a downstream
# `pbfhogg` dependency build at. Workspace feature unification can otherwise
# hide a feature one crate only gets from the other. Gate-only.
[member_check]
when = "gate"
targets = ["lib", "bins"]

# Resolve intra-doc links under each check build shape. Any rustdoc diagnostic
# fails the phase, including warnings; the complete gate cannot skip it.
[rustdoc]

[bin]
default = "pbfhogg"
install = ["pbfhogg-cli"]
