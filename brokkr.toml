project = "pbfhogg"

# Env variables that match these are captured by brokkr during runs and stored in the database.
capture_env = ["PBFHOGG*", "MALLOC*"]

# brokkr check + test sweeps. Each [[check]] entry is one (clippy +
# test) pass with its own feature shape. Profiles in [test.profiles]
# reference these by name and layer libtest filters on top.
#
#  - "all"      = test-hooks (fault injection, `pbfhogg::test_hooks`; the
#                 fault tests run here with every other test) +
#                 linux-direct-io + linux-io-uring. Mirrors what --all-features used to
#                 pull in MINUS hotpath (#[hotpath::measure] turns into
#                 runtime measurement that emits a banner to stdout at
#                 process exit, contaminating stdout-output commands
#                 like `pbfhogg diff` under integration tests; hotpath
#                 stays opt-in via `brokkr <cmd> --hotpath`) and MINUS
#                 `commands` because pbfhogg's `default = ["commands"]`
#                 already enables it whenever no_default_features is
#                 false, and pbfhogg-cli always pulls it in via its lib
#                 dep.
#  - "consumer" = no-default-features view; what a downstream library
#                 user builds with `default-features = false, features =
#                 ["commands"]`. Catches lints in always-compiled code
#                 that proc-macros silently mask (e.g. #[hotpath::measure]
#                 swallowing function bodies). Also tests pbfhogg-cli
#                 built without linux-direct-io / linux-io-uring, so the
#                 cli_sort.rs feature_missing tests (gated on
#                 `cfg(not(feature = "linux-..."))`) fire in this sweep
#                 against a CLI that doesn't support the flag; for
#                 pbfhogg-cli this shape is its default build (default =
#                 [], and its `commands` feature is a no-op that exists
#                 purely so brokkr can apply `--features commands` to
#                 both crates).
#
# The sweeps that test the CLI select both packages. Every test that
# drives the `pbfhogg` binary lives in pbfhogg-cli (cli/tests/all.rs),
# where cargo builds the binary with that test build's features and hands
# its path as CARGO_BIN_EXE_pbfhogg - so there is no build_packages
# pre-build and no binary from another sweep to pick up. Both packages
# declare test-hooks, linux-direct-io and linux-io-uring under the same
# names, so one feature list serves both. A sweep that must keep the
# library alone (minimal, geocode-reader) leaves pbfhogg-cli out: its lib
# dep would turn `commands` back on.

[[check]]
name = "all"
packages = ["pbfhogg", "pbfhogg-cli"]
features = ["test-hooks", "linux-direct-io", "linux-io-uring"]
# `parallel = {}` runs the sweep's test binaries concurrently - prebuilt
# binaries executed directly, budget = tests in flight, defaulting to the L3
# cache domain (the right default for a compute-bound suite). Until 2026-09-02
# every profile here ran libtest's serial default, so this is the first
# parallelism the suite has seen; the per-test 20s watchdog is kept. Two-run
# ritual to judge it: the first run weights by test count (always the slow
# one), and `claims 1-1` on the second means the budget needs raising (see
# brokkr man config parallel). Since the test fold (autotests = false) the
# sweep's binaries are each package's lib unit tests and `all` binary, and
# the process_nofile target; the fan-out therefore parallelizes mostly
# inside the two `all` binaries, and shared scratch between concurrent
# cli_* modules is the class to suspect first if a test flakes.
parallel = {}

[[check]]
name = "consumer"
packages = ["pbfhogg", "pbfhogg-cli"]
no_default_features = true
features = ["commands"]
parallel = {}

# "minimal" = the configuration the crate advertises but never built.
# `consumer` sets no_default_features and then re-enables `commands`, so
# until this entry existed no sweep ever compiled pbfhogg without it and
# `default-features = false` was an untested claim.
#
# No pbfhogg-cli, deliberately. pbfhogg-cli pins its lib dep as
# `default-features = false, features = ["commands"]`, so the moment the
# CLI joins the build cargo's feature unification turns `commands` back
# on and the sweep silently stops testing what it is named for. This
# sweep must stay scoped to the library package alone.
#
# Integration tests that reach into the feature-gated modules
# (`check`, `export`, `extract`, `inspect::json`, `geocode_index`) carry
# a `#[cfg(feature = "commands")]` on their `mod` line in tests/all.rs so
# they drop out here and still run in full under `all` and `consumer`.
[[check]]
name = "minimal"
no_default_features = true
features = []
parallel = {}

# Library-only geocode reader configuration, without the builder or CLI.
[[check]]
name = "geocode-reader"
packages = ["pbfhogg"]
no_default_features = true
features = ["geocode-reader"]
parallel = {}

# The glibc-only allocator calls (mallopt, mallinfo2, malloc_trim) are gated
# on target_env = "gnu"; this sweep builds, lints and runs the suite against
# musl so an ungated call fails here rather than in a downstream musl build.
# x86_64 musl binaries run natively on the glibc host.
[[check]]
name = "musl"
packages = ["pbfhogg", "pbfhogg-cli"]
target = "x86_64-unknown-linux-musl"
parallel = {}

# Doctests live in cargo's `--doc` pseudo-target, which a `parallel` sweep
# cannot carry, and `[test] doctests` is off by default - so until this entry
# existed no doctest in the library ever ran, and a broken example in a doc
# comment was invisible. Workspace-shaped (no `packages`) on purpose: a gate
# needs at least one doctest carrier that spans the whole workspace. Run
# through the gate profile only, to keep tier1 fast.
# pbfhogg-cli's library target is the program, not an API, and sets
# `doctest = false`, so it is excluded rather than the lane being
# package-scoped.
[[check]]
name = "doctests"
doc_only = true
test_exclude_packages = ["pbfhogg-cli"]

# Compile each workspace member's lib and bins under its own package-mode
# resolve - the boundary `cargo install pbfhogg-cli` and a downstream
# `pbfhogg` dependency build at. Workspace feature unification can otherwise
# hide a feature one crate only gets from the other. Gate-only.
[member_check]
when = "gate"
targets = ["lib", "bins"]

# AGENTS.md's document-folder rule, enforced rather than trusted: nothing
# durable (reference/, docs/, code comments) may cite notes/, and durable
# docs must not point at files that no longer exist. Reads tracked files
# only, so data/ and research/ never count. pre-clippy: text only, no build.
[[script_check]]
name = "doc-links"
command = "python3 scripts/check_doc_links.py"
expect = "document conventions ok"
match = "last-line"
stage = "pre-clippy"

# glibc-only allocator calls live in src/debug.rs and src/process.rs, behind
# `cfg(all(target_os = "linux", target_env = "gnu"))` with a no-op fallback.
# A call gated on `target_os = "linux"` alone also compiles for musl, where
# these symbols do not exist, and nothing here builds against musl - so the
# one way to keep musl building is to keep calls in gated debug/process wrappers.
# Matches the `libc::` path, so callers of the wrappers (`crate::debug`'s
# `emit_mallinfo2`; `crate::process`'s `cap_malloc_arenas`, `malloc_trim` and
# `set_mmap_threshold`) stay legal, and `region = "code"` lets comments
# discuss the calls by name.
[[textlint]]
name = "glibc-allocator-calls-live-in-debug"
pattern = '\blibc::(?:mallopt|mallinfo2?|malloc_trim|malloc_stats|malloc_info|M_[A-Z_]+)\b'
paths = ["src/**/*.rs", "cli/src/**/*.rs", "tests/**/*.rs", "cli/tests/**/*.rs", "benches/**/*.rs"]
exclude = ["src/debug.rs", "src/process.rs"]
region = "code"
message = "glibc-only allocator calls belong in target_env gnu gated debug/process wrappers"

# Stdout discipline. `print!`/`println!` panic when stdout's reader goes away,
# so `pbfhogg inspect x.pbf | head` used to die with exit 101. The CLI writes
# through cli/src/output.rs, whose writer turns EPIPE into a silent exit 0;
# the library never owns its host's stdout and renders into a caller-supplied
# `io::Write` instead. Rule two matches the bare identifier, not the call, so
# `use std::io::stdout as out;` cannot rename its way past it.
# `region = "code"` keeps doc examples, comments and
# clap help strings out of scope. `eprintln!` stays legal.
# tests/common is mounted by path into pbfhogg (where `commands` is on by
# default) and into pbfhogg-cli (where `commands` is a no-op feature, off in
# the `all` and `musl` sweeps). A gate on either feature in a shared helper
# would silently drop CLI tests out of those sweeps. Comment lines are exempt
# so the explanation can name the features.
[[textlint]]
name = "no-library-feature-gates-in-tests-common"
pattern = 'feature\s*=\s*"(?:commands|geocode-reader)"'
paths = ["tests/common/**/*.rs"]
except = ['^\s*//']
message = "tests/common is shared with pbfhogg-cli, where `commands` means something else; gate the mod line in tests/all.rs instead, never a shared helper"

# Fault injection is per-run: every hook's state lives in the fault plan the
# run's token carries (src/test_hooks.rs), so an armed fault cannot reach a
# sibling test in a shared harness. A `static` there, or a `test_hooks`
# module anywhere else, would bring back process-global hooks and the
# one-process-per-test machinery they needed.
[[textlint]]
name = "no-static-fault-hook-state"
pattern = '^\s*(?:pub(?:\([^)]*\))?\s+)?static\s'
paths = ["src/test_hooks.rs"]
region = "code"
message = "fault-hook state lives in FaultPlan, carried by the run's Invocation token; a static would fire in every concurrent test of the process"

[[textlint]]
name = "fault-hooks-only-in-test-hooks"
pattern = '\bmod\s+\w*test_hooks\b'
paths = ["src/**/*.rs"]
exclude = ["src/lib.rs"]
region = "code"
message = "fault hooks go in pbfhogg::test_hooks (src/test_hooks.rs) as FaultPlan fields, not in a module of their own"

[[textlint]]
name = "no-print-macro"
pattern = '\b(?:print|println)!\s*[\(\[\{]'
paths = ["src/**/*.rs", "cli/src/**/*.rs"]
region = "code"
message = "print!/println! panic when stdout's reader goes away (pbfhogg ... | head); in the CLI write through output::buffered, in the library into a caller-supplied io::Write"

[[textlint]]
name = "no-stdout-handle"
pattern = '\bstdout\b'
paths = ["src/**/*.rs", "cli/src/**/*.rs"]
exclude = ["cli/src/output.rs"]
region = "code"
message = "only cli/src/output.rs acquires stdout; use output::buffered, or have the library take an io::Write"

# Header feature spellings live in `read/block.rs` feature constants. Test
# sources intentionally spell them when building or checking literal fixtures.
# The renumber wire rewriter also uses `DenseNodes` as a protobuf field label.
[[textlint]]
name = "header-features-via-feature-constants"
pattern = '"(?:OsmSchema-V0\.6|DenseNodes|Sort\.Type_then_ID|LocationsOnWays|HistoricalInformation|pbfhogg\.WayMembers-v1|pbfhogg\.SharedNodePins-v1)"'
paths = ["src/**/*.rs", "cli/src/**/*.rs"]
exclude = ["src/read/block.rs"]
except = [
    '2 => "DenseNodes",',
    'repeated_message_field_error\("PrimitiveGroup", "DenseNodes"\)',
    '(?:unpacked_field_error|repeated_field_error)\("DenseNodes",',
]
region = "string"
message = "Use the Feature constants from read/block.rs for PBF header feature names"

# Read-side data the crate has already validated (a constructed block, the
# OSC overlay's arena) is consumed with a panic on a broken invariant, never
# a fallback: an empty tag, a default Info or a dropped element is the silent
# wrong answer validation exists to prevent (`validated` in read/block.rs,
# `arena_invariant_broken` in osc/interner.rs). Input that can genuinely be
# bad is refused with an error. A Result-to-Option `.ok()` in these paths is
# therefore either a swallow or a deliberate "absent" answer, and the second
# carries `// ok-deliberate: <reason>` on the same line; the except regex
# insists on a non-empty reason. Text checks, not proof: the swallow
# spellings `if let Ok`, `.is_err()` then `return None`, `.flatten()` and
# `unwrap_or_default` are common in legitimate optional-field handling and
# are left to review, as is an `.unwrap_or(` whose `""` rustfmt leaves on
# the next line.
[[textlint]]
name = "read-side-ok-is-deliberate"
pattern = '\.ok\(\)'
paths = ["src/read/**/*.rs", "src/blob_meta/**/*.rs", "src/osc/**/*.rs", "src/owned.rs"]
except = ['//\s*ok-deliberate:\s*\S']
region = "code"
test_code = "skip"
must_scan = [
    "src/read/block.rs",
    "src/read/dense.rs",
    "src/read/elements.rs",
    "src/osc/compact.rs",
    "src/osc/interner.rs",
    "src/osc/write.rs",
    "src/owned.rs",
]
message = "A .ok() on validated read-side data swallows a broken invariant; panic through the module's invariant helper, return the error, or mark a deliberate absent answer with // ok-deliberate: <reason>"

# The exact spelling the OSC arena used to turn a bad intern id or bad UTF-8
# into an empty tag key, role, value or user name. Matched on the raw line
# (`region = "code"` would blank the literal), so comment lines are exempt.
[[textlint]]
name = "read-side-no-empty-string-fallback"
pattern = '\.unwrap_or\(""\)'
paths = ["src/read/**/*.rs", "src/blob_meta/**/*.rs", "src/osc/**/*.rs", "src/owned.rs"]
except = ['^\s*//', '//\s*ok-deliberate:\s*\S']
test_code = "skip"
message = "An empty-string fallback on read-side data writes a silent wrong tag, role or user; panic on the broken invariant or return the error"

[bin]
default = "pbfhogg"
install = ["pbfhogg-cli"]

[test]
debug = true
default_package = "pbfhogg"
default_profile = "tier1"
gate_profile = "gate"

# Tier 1 - fast contracts. brokkr check's inner-loop signal during
# refactor. Skips the tier2/tier3/serial submodules; runs everything
# else across every listed sweep, the O_DIRECT and io_uring tests
# included (they exist only in the `all` sweep, which builds both
# features, and skip on a typed platform refusal). `minimal` contributes
# mostly a compile + clippy gate: the commands-gated test files cfg
# themselves out there.
[test.profiles.tier1]
description = "Fast edit loop used by brokkr check (tier 1)"
sweeps = ["all", "consumer", "minimal", "geocode-reader", "musl"]
skip = ["tier2::", "tier3::", "serial::"]
include_ignored = false

# Tier 3 - full in-project correctness gate (pre-merge). include_ignored
# picks up fast ignored tests that #[ignore] keeps out of tier 1.
# sort_overlapping_blobs_uring is skipped by name: it is ignored for a
# known io_uring small-output bug, and on a host that can run io_uring
# include_ignored would otherwise run it here and fail. Tests slower than brokkr check's fixed
# 20 s per-test kill are skipped here BY NAME and must be run
# individually via `brokkr test <name> --timeout <secs>` (add
# `-p pbfhogg-cli` when the test is a CLI one, as sort_cross_validate_osmium
# is); without the
# skip the profile could never pass, by construction.
#
# WARNING, and it has bitten once (2026-08-20): these entries are SUBSTRING
# matches, not exact test names. Every fast synthetic test whose name merely
# CONTAINS one of them is silently excluded from this gate too - it still
# passes under tier1, so nothing goes red and nothing announces the loss.
# Two short real-data test names were swallowing four synthetic
# geocode tests that way. Before adding a short name here, grep the suite for
# it; before naming a new test, check it does not contain an entry below.
[test.profiles.full]
description = "Full in-project correctness gate (tier 3, pre-merge); over-watchdog tests run individually via brokkr test"
sweeps = ["all"]
skip = [
    "cli_sort::backends::sort_overlapping_blobs_uring",
    "sort_cross_validate_osmium",
]
include_ignored = true

# Tests requiring --test-threads=1. Fault tests are not a serial case
# (their hooks are per-run, see `pbfhogg::test_hooks`); this profile is
# reserved for any future serial-only test.
# Note the entries now carry `parallel` (2026-09-02): if a serial:: test
# ever materializes, give this profile a parallel-free twin of `all`
# (same build shape, clippy dedupes) rather than running it through the
# fan-out - the nautilus config is the worked example of that split.
[test.profiles.serial]
description = "Serial tests requiring --test-threads=1"
sweeps = ["all"]
only = ["serial::"]
include_ignored = true
test_threads = 1

# Tier 2 command-slice precedent. cli/tests/cli_sort.rs is already split into
# root (tier 1) + mod backends (also tier 1); once it grows a mod tier2 (many-blob
# boundary fixtures, scratch-leak sweeps), this profile picks them up.
# Add similar entries for other commands as their tier-2 matrices
# land - per testing.md, there is no generic tier2 profile.
#
# The sweeps are named rather than inherited from tier1: cli_sort lives in
# pbfhogg-cli, so the root-only sweeps (minimal, geocode-reader) hold no
# cli_sort test. Verified with `brokkr check --profile sort` and the tier1
# sweep list at a time it held a root-only sweep ahead of these: the run
# stopped there with "cargo test: zero tests ran", and the sweeps after it
# never ran. These three are every
# shape the CLI tests run in.
[test.profiles.sort]
description = "Tier 2: expanded sort command tests"
extends = "tier1"
sweeps = ["all", "consumer", "musl"]
tests = ["all"]
only = ["cli_sort::"]
skip = ["serial::"]

# `brokkr check --gate`: every sweep with no filters, plus doctests, plus the
# coverage audit. Under `certifies = "complete"` every (build shape, test)
# pair must run, be `#[ignore]`d at the source, or be justified by a
# `[[quarantine]]` entry - otherwise the check fails as orphaned. That is the
# failure the substring skips in `full` caused silently (see its comment):
# a test that stops running cannot go unnoticed here.
[test.profiles.gate-tests]
description = "Every sweep, unfiltered"
sweeps = ["all", "consumer", "minimal", "geocode-reader", "musl"]

[test.profiles.doc-twin]
description = "The doc-only carrier"
sweeps = ["doctests"]

[test.profiles.gate]
description = "Every sweep unfiltered, doctests, and the coverage audit"
lanes = ["gate-tests", "doc-twin"]
certifies = "complete"

# ---------------------------------------------------------------------------
# Per-machine configuration, keyed by hostname.
# Unknown hostnames fall back to defaults: data="data", scratch="data/scratch".
# Datasets are scoped per host - each machine lists only the datasets it has.
# ---------------------------------------------------------------------------

[plantasjen]
data = "data"
scratch = "data/bench-tmp"
# Cross-disk / second-NVMe bench scratch. Swap with the line above to run
# writer-backend benches with bench byproducts (output PBFs, sidecar
# FIFOs, hotpath reports) landing on a physically separate NVMe, so
# input reads and output writes don't contend for the same disk. Revert
# after the bench pass. Either commit the swap (clean tree, results go
# to .brokkr/results.db) or run benches with `--force` (results NOT
# stored).
#scratch = "/media/folk/Booty/pbfhogg-bench-tmp"
target = "target"
features = ["linux-direct-io", "linux-io-uring"]

[plantasjen.drives]
source = "nvme"
data = "nvme"
scratch = "nvme"
target = "hdd"

