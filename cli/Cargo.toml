[package]
name = "pbfhogg-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line OpenStreetMap PBF toolkit"
readme = "README.md"
rust-version.workspace = true
authors.workspace = true
keywords = ["osm", "openstreetmap", "pbf", "cli", "gis"]
categories = ["command-line-utilities", "science::geo"]
# Integration tests are declared below rather than discovered, matching the
# root crate: a new file in cli/tests/ is a module of an existing target, or
# a [[test]] of its own with the reason beside it, never a silent extra
# binary.
autotests = false
# Nor are bins, examples or benches: a stray src/bin/x.rs would get a unit-test
# harness that scripts/check_static_hook_targets.py never inspects.
autobins = false
autoexamples = false
autobenches = false

# The program is a library target so this package's tests reach the command
# tree production parses (`cli_command`): the unit tests in src/ walk it (the
# short-flag vocabulary, the retired shorts) and the integration tests take
# the subcommand list from it. Not an API, so no doctests.
[lib]
name = "pbfhogg_cli"
path = "src/lib.rs"
doctest = false

# Only `main` calling `pbfhogg_cli::run`; nothing to unit-test.
[[bin]]
name = "pbfhogg"
path = "src/main.rs"
test = false

# Every CLI-driving integration test, as modules of one binary (the root
# package's tests/all.rs is the library's twin). They live here because cargo
# builds the binary with this test build's features and hands its path as
# CARGO_BIN_EXE_pbfhogg only to this package's tests.
[[test]]
name = "all"
path = "tests/all.rs"

[features]
default = []
# No-op passthrough. pbfhogg-cli's lib dep always pulls in
# `pbfhogg/commands`, so this feature does nothing semantic; it
# exists so brokkr.toml `[[check]]` sweeps that select both packages
# can apply the same `--features commands` flag to each without
# pbfhogg-cli rejecting the unknown feature.
commands = []
hotpath = ["pbfhogg/hotpath"]
hotpath-alloc = ["pbfhogg/hotpath-alloc"]
linux-direct-io = ["pbfhogg/linux-direct-io"]
linux-io-uring = ["pbfhogg/linux-io-uring"]
# pbfhogg's per-instance test hooks, and the CLI's own (the cancellation
# pause and count read from the environment, src/signals.rs). The `all` check
# sweep enables it; production builds never do. There is
# deliberately no `static-test-hooks` here: no CLI-driving test needs a
# process-global hook, and this package's test harnesses refuse to compile
# against a pbfhogg built with them (see the assertion in cli/src/lib.rs).
test-hooks = ["pbfhogg/test-hooks"]

[dependencies]
pbfhogg = { version = "0.5", path = "..", default-features = false, features = ["commands"] }
clap = { version = "4.6.1", features = ["derive"] }
serde_json.workspace = true
hotpath = "0.28.7"
# sigwait / pthread_sigmask / _exit for SIGINT and SIGTERM (src/signals.rs).
libc = "0.2.186"

[dev-dependencies]
tempfile = "3.27.0"
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
zstd = "0.14.0"

[lints]
workspace = true
