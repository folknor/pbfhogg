[package]
name = "pbfhogg-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line OpenStreetMap PBF toolkit"
readme = "README.md"
rust-version.workspace = true
authors.workspace = true
keywords = ["osm", "openstreetmap", "pbf", "cli", "gis"]
categories = ["command-line-utilities", "science::geo"]
# Integration tests are declared below rather than discovered, matching the
# root crate: a new file in cli/tests/ is a module of an existing target, or
# a [[test]] of its own with the reason beside it, never a silent extra
# binary.
autotests = false

# The unit tests in cli/src walk the clap command tree itself (the short-flag
# vocabulary, the retired shorts), which only code inside the binary can
# reach.
[[bin]]
name = "pbfhogg"
path = "src/main.rs"

# Drives the binary through cargo's CARGO_BIN_EXE_pbfhogg, which only this
# package's tests receive.
[[test]]
name = "cli"
path = "tests/cli.rs"

[features]
default = []
# No-op passthrough. pbfhogg-cli's lib dep always pulls in
# `pbfhogg/commands`, so this feature does nothing semantic; it
# exists so brokkr.toml `[[check]]` sweeps can apply the same
# `--features commands` flag to both `cargo test -p pbfhogg` and
# `cargo build -p pbfhogg-cli` without the latter rejecting the
# unknown feature.
commands = []
hotpath = ["pbfhogg/hotpath"]
hotpath-alloc = ["pbfhogg/hotpath-alloc"]
linux-direct-io = ["pbfhogg/linux-direct-io"]
linux-io-uring = ["pbfhogg/linux-io-uring"]
# Re-exports pbfhogg's test-only fault-injection hooks so the CLI
# compiles cleanly under `cargo ... --all-features`. Production
# builds don't enable this.
test-hooks = ["pbfhogg/test-hooks"]

[dependencies]
pbfhogg = { version = "0.5", path = "..", default-features = false, features = ["commands"] }
clap = { version = "4.6.1", features = ["derive"] }
serde_json.workspace = true
hotpath = "0.28.7"
# sigwait / pthread_sigmask / _exit for SIGINT and SIGTERM (src/signals.rs).
libc = "0.2.186"

[dev-dependencies]
tempfile = "3.27.0"

[lints]
workspace = true
