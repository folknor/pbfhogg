# Methods that write, or open for reading, a file by path. The lint is off workspace-wide
# (`disallowed_methods = "allow"` in Cargo.toml) and denied by crate attribute in
# the shipped code: the whole library (`src/lib.rs`, outside `cfg(test)`) and the
# CLI (`cli/src/lib.rs`, `cli/src/main.rs`). Examples, benches and integration
# tests are separate crates and stay free. An output is a
# `pbfhogg::output::Output` - staged, refused if it exists without overwrite
# permission, published only on success - and a scratch file the run owns goes
# through `crate::scratch`; those two modules own the calls below and allow the
# lint module-wide. Any other exemption sits on the single statement, or the
# one-call helper, that makes the privileged call, and says why.
disallowed-methods = [
    { path = "std::fs::File::create", reason = "outputs go through pbfhogg::output::Output, scratch through crate::scratch" },
    { path = "std::fs::File::create_new", reason = "outputs go through pbfhogg::output::Output, scratch through crate::scratch" },
    { path = "std::fs::OpenOptions::open", reason = "outputs go through pbfhogg::output::Output, scratch through crate::scratch" },
    { path = "std::fs::write", reason = "outputs go through pbfhogg::output::Output, scratch through crate::scratch" },
    { path = "std::fs::copy", reason = "outputs go through pbfhogg::output::Output, scratch through crate::scratch" },
    # Scratch lives in one per-run directory (`crate::scratch::RunScratch`),
    # whose paths are the only ones scratch files are created at and which
    # removes everything on drop. Making, removing or renaming directory
    # entries by hand, naming a file after the pid, or reaching for the
    # system temp directory is a second scratch mechanism.
    { path = "std::fs::create_dir", reason = "scratch directories come from crate::scratch::RunScratch" },
    { path = "std::fs::create_dir_all", reason = "scratch directories come from crate::scratch::RunScratch" },
    { path = "std::fs::remove_file", reason = "scratch is removed with RunScratch::remove or by its guard; outputs by crate::output" },
    { path = "std::fs::remove_dir", reason = "scratch is removed with RunScratch::remove_tree or by its guard; outputs by crate::output" },
    { path = "std::fs::remove_dir_all", reason = "scratch is removed with RunScratch::remove_tree or by its guard; outputs by crate::output" },
    { path = "std::fs::rename", reason = "outputs are published by crate::output" },
    { path = "std::fs::hard_link", reason = "outputs are published by crate::output" },
    # An output file is finished by its writer (`OutputWriter::finish`, or the
    # PBF writer's flush) and synced by `crate::output` at publication,
    # through the writer-metrics funnel. A hand-rolled sync is a second owner
    # of durability that the sidecar cannot see.
    { path = "std::fs::File::sync_all", reason = "outputs are synced by crate::output at publication, through the writer-metrics funnel" },
    { path = "std::fs::File::sync_data", reason = "outputs are synced by crate::output at publication, through the writer-metrics funnel" },
    # An input is opened or read through `crate::read::input` (the CLI: its
    # own `open_input`), which names the path in a failure. A bare `open(2)`
    # error says "No such file or directory" and not which of a command's
    # inputs it was.
    { path = "std::fs::File::open", reason = "inputs open through crate::read::input, which names the path" },
    { path = "std::fs::read", reason = "inputs are read through crate::read::input, which names the path" },
    { path = "std::fs::read_to_string", reason = "inputs are read through crate::read::input, which names the path" },
    { path = "std::process::id", reason = "scratch is named by its run directory, not by pid" },
    { path = "std::env::temp_dir", reason = "scratch goes where the caller put the run directory" },
]
